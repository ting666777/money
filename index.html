<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智慧記帳">
  <meta name="mobile-web-app-capable" content="yes">
  <title>定成 & 妤珊 記帳</title>
  <meta name="theme-color" id="theme-color-meta" content="#0b0f19">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function() {
      try {
        var u = localStorage.getItem("active_user") || "定成";
        var t = localStorage.getItem("theme_" + u) || (u === "妤珊" ? "milktea" : "dark");
        var valids = ["dark", "white", "milktea", "pink", "cyberpunk"];
        var safe = valids.indexOf(t) !== -1 ? t : (u === "妤珊" ? "milktea" : "dark");
        document.documentElement.setAttribute("data-theme", safe);
        var bgs = {
          "dark": "#0b0f19",
          "white": "#f8fafc",
          "milktea": "#f6efe6",
          "pink": "#fdf2f8",
          "cyberpunk": "#080012"
        };
        var m = document.getElementById("theme-color-meta") || document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bgs[safe] || "#0b0f19");
      } catch(e) {}
    })();
  </script>
  <link rel="apple-touch-icon" sizes="180x180" href="PIC1.jpg">
  <link rel="icon" type="image/jpeg" href="PIC1.jpg">
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #0b0f19;
      --card: #151d2f;
      --card-soft: #111827;
      --card-border: #243049;
      --text: #f1f5f9;
      --text-muted: #8292ab;
      --ding: #38bdf8;
      --yu: #f472b6;
      --expense: #fb7185;
      --income: #34d399;
      --accent: #6366f1;
      --hero-bg: linear-gradient(145deg, #162035, #111827);
      --pill-active-bg: #1f293d;
      --radius: 16px;
    }

    [data-theme="white"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-soft: #f1f5f9;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --ding: #0284c7;
      --yu: #db2777;
      --expense: #e11d48;
      --income: #16a34a;
      --accent: #4f46e5;
      --hero-bg: linear-gradient(145deg, #ffffff, #f1f5f9);
      --pill-active-bg: #ffffff;
    }

    [data-theme="milktea"] {
      --bg: #f6efe6;
      --card: #fffdf9;
      --card-soft: #eee4d6;
      --card-border: #dfcfbb;
      --text: #4a3b32;
      --text-muted: #8b7667;
      --ding: #5c7c99;
      --yu: #bf6e7e;
      --expense: #c65d47;
      --income: #4a8c6f;
      --accent: #a67c52;
      --hero-bg: linear-gradient(145deg, #fffdf9, #f3e8d8);
      --pill-active-bg: #ffffff;
    }

    [data-theme="pink"] {
      --bg: #fdf2f8;
      --card: #fffafc;
      --card-soft: #fce7f3;
      --card-border: #f5c2dc;
      --text: #701a46;
      --text-muted: #ad537c;
      --ding: #0284c7;
      --yu: #db2777;
      --expense: #e11d48;
      --income: #10b981;
      --accent: #ec4899;
      --hero-bg: linear-gradient(145deg, #fffafc, #fce7f3);
      --pill-active-bg: #ffffff;
    }

    [data-theme="cyberpunk"] {
      --bg: #080012;
      --card: #130428;
      --card-soft: #1d083a;
      --card-border: #00f0ff;
      --text: #fcee09;
      --text-muted: #00f0ff;
      --ding: #00f0ff;
      --yu: #ff007f;
      --expense: #ff0055;
      --income: #00ff9f;
      --accent: #ff007f;
      --hero-bg: linear-gradient(145deg, #1f073b, #0c021c);
      --pill-active-bg: #290a52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    html {
      min-height: 100%;
      height: 100%;
      background-color: var(--bg);
      transition: background-color 0.25s ease;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: var(--bg);
      transition: background-color 0.25s ease;
      color: var(--text);
      padding: 14px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
      padding-left: max(14px, env(safe-area-inset-left, 14px));
      padding-right: max(14px, env(safe-area-inset-right, 14px));
      max-width: 600px;
      margin: 0 auto;
      touch-action: pan-y;
      box-sizing: border-box;
    }

    /* 📱 PWA / iOS 加入主畫面全螢幕模式：完美對齊動態島與狀態列（向上微調貼合，高雅舒適） */
    @supports (padding-top: env(safe-area-inset-top)) {
      body {
        padding-top: max(calc(env(safe-area-inset-top) + 6px), 18px);
      }
    }

    @media all and (display-mode: standalone) {
      body {
        padding-top: calc(env(safe-area-inset-top, 0px) + 24px) !important;
      }
      .top-bar {
        margin-top: 0 !important;
      }
    }

    body.pwa-standalone {
      padding-top: calc(env(safe-area-inset-top, 0px) + 24px) !important;
    }

    body.pwa-standalone .top-bar {
      margin-top: 0 !important;
    }

    /* 🚀 iPhone Siri / Apple Intelligence 風格流動光暈 (動態邊緣羽化，無死板粗線條) */
    .screen-neon-border {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .screen-neon-border.active {
      display: block;
      opacity: 1;
    }

    /* 第一層：邊界飽和霓虹光帶，向內柔和羽化 (Siri Primary Edge) */
    .screen-neon-border.active::before {
      content: "";
      position: absolute;
      inset: -6px;
      border: 14px solid transparent;
      border-image: conic-gradient(
        from var(--siri-angle, 0deg),
        #00d2ff 0%,
        #6366f1 18%,
        #a855f7 35%,
        #ec4899 52%,
        #fb7185 68%,
        #f59e0b 84%,
        #00d2ff 100%
      ) 1;
      filter: blur(9px) brightness(1.25);
      opacity: 0.95;
      animation: siri-rotate 3s linear infinite, siri-breathe 2s ease-in-out infinite alternate;
    }

    /* 第二層：深層大範圍氛圍暈染 (Siri Ambient Diffusion) */
    .screen-neon-border.active::after {
      content: "";
      position: absolute;
      inset: -14px;
      border: 32px solid transparent;
      border-image: conic-gradient(
        from calc(var(--siri-angle, 0deg) + 60deg),
        #ec4899 0%,
        #fb7185 20%,
        #f59e0b 38%,
        #00d2ff 56%,
        #6366f1 74%,
        #a855f7 90%,
        #ec4899 100%
      ) 1;
      filter: blur(24px) brightness(1.15);
      opacity: 0.7;
      animation: siri-rotate 4.5s linear infinite reverse;
    }

    @property --siri-angle {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes siri-rotate {
      0% { --siri-angle: 0deg; }
      100% { --siri-angle: 360deg; }
    }

    @keyframes siri-breathe {
      0% {
        opacity: 0.8;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.008);
      }
      100% {
        opacity: 0.8;
        transform: scale(1);
      }
    }

    /* =========================================================
       區塊 1：頂部極簡列（切換是誰 / 單人名稱 ＋ 重新整理、除錯、設定）
       ========================================================= */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 2px 0;
    }

    .user-pill-group {
      display: flex;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }

    .user-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .user-pill.active-ding {
      background: rgba(56, 189, 248, 0.2);
      color: var(--ding);
    }

    .user-pill.active-yu {
      background: rgba(244, 114, 182, 0.2);
      color: var(--yu);
    }

    .locked-user-title {
      display: none;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 6px 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 999px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      cursor: pointer;
      position: relative;
      box-shadow: 0 2px 5px rgba(74, 59, 50, 0.05);
      transition: all 0.18s ease;
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .icon-btn:active {
      background: var(--card-soft);
      transform: scale(0.94);
    }

    .icon-btn.spinning {
      animation: neon-spin 0.8s linear infinite !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 12px rgba(166, 124, 82, 0.5), inset 0 0 6px rgba(166, 124, 82, 0.35) !important;
    }

    .icon-btn.spinning span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: spin-glyph 0.8s linear infinite;
    }

    @keyframes neon-spin {
      0% {
        box-shadow: 0 0 6px rgba(166, 124, 82, 0.45), inset 0 0 4px rgba(166, 124, 82, 0.3);
        border-color: #a67c52;
      }
      50% {
        box-shadow: 0 0 16px rgba(191, 110, 126, 0.6), inset 0 0 8px rgba(191, 110, 126, 0.45);
        border-color: #bf6e7e;
      }
      100% {
        box-shadow: 0 0 6px rgba(166, 124, 82, 0.45), inset 0 0 4px rgba(166, 124, 82, 0.3);
        border-color: #a67c52;
      }
    }

    @keyframes spin-glyph {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .badge-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      background: #c65d47;
      border-radius: 50%;
    }

    /* ⚠️ 頂部常駐錯誤與重複警告橫幅 */
    .alert-banner {
      display: none;
      background: #fdf2f0;
      border: 1px solid #eab6ad;
      border-left: 5px solid #c65d47;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      color: #8c3828;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .alert-banner:active {
      transform: scale(0.99);
      background: #fae5e1;
    }

    .alert-banner-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .alert-banner-text {
      font-weight: 700;
      line-height: 1.4;
    }

    .alert-banner-btn {
      background: #c65d47;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* 左右滑動動態舞台 */
    .swipe-stage {
      touch-action: pan-y;
    }

    /* =========================================================
       區塊 2：整合總覽區（預算 + 日期/天月年 + 今日支出 + 分類比例）
       ========================================================= */
    .block-2-overview-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 15px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* 2-1: 預算進度條（適度放寬上下距離） */
    .budget-compact-row {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 2px 0 4px 0;
      cursor: pointer;
    }

    .budget-compact-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .budget-compact-track {
      position: relative;
      height: 20px;
      background: var(--card-soft);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .budget-compact-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      border-radius: 999px;
      transition: width 0.3s ease, background 0.25s ease;
    }

    .budget-compact-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text);
      text-shadow: none;
    }

    /* 2-2: 日期切換 與 天/月/年 同一排 */
    .date-and-dim-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card-soft);
      border: 1px solid var(--card-border);
      border-radius: 11px;
      padding: 6px 8px;
    }

    .date-nav-left {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .nav-arrow-sm {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-arrow-sm:active {
      background: rgba(128, 128, 128, 0.14);
      color: var(--text);
    }

    .nav-select-box {
      position: relative;
      flex: 1;
      text-align: center;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 7px;
      transition: background 0.15s ease;
    }

    .nav-select-box:active {
      background: rgba(128, 128, 128, 0.14);
    }

    .nav-date-text {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* 📅 彈出式行事曆月曆選擇器 (Calendar Picker Modal) */
    .calendar-picker-overlay {
      display: none;
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1050;
    }

    .calendar-picker-overlay.open {
      display: flex;
      visibility: visible;
      pointer-events: auto;
    }

    .calendar-modal-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 340px;
      padding: 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      animation: calPopIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes calPopIn {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      background: var(--card-soft);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .cal-nav-btn:active {
      transform: scale(0.92);
    }

    .cal-header-title {
      font-size: 0.96rem;
      font-weight: 900;
      color: var(--text);
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .cal-header-title:hover {
      background: var(--card-soft);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 6px;
    }

    .cal-weekday {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .cal-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day-cell {
      position: relative;
      height: 38px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.14s ease;
      font-variant-numeric: tabular-nums;
      padding: 0;
    }

    .cal-day-cell:hover {
      background: var(--card-soft);
    }

    .cal-day-cell:active {
      transform: scale(0.92);
    }

    .cal-day-cell.other-month {
      color: var(--text-muted);
      opacity: 0.35;
    }

    .cal-day-cell.is-today {
      border-color: var(--accent);
      color: var(--accent);
    }

    .cal-day-cell.selected {
      background: var(--accent) !important;
      color: #ffffff !important;
      border-color: var(--accent) !important;
      box-shadow: 0 3px 10px rgba(99, 102, 241, 0.35);
    }

    .cal-has-rec-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--expense);
      margin-top: 2px;
    }

    .cal-day-cell.selected .cal-has-rec-dot {
      background: #ffffff;
    }

    .cal-months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 4px 0;
    }

    .cal-month-cell {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-soft);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .cal-month-cell:active {
      transform: scale(0.95);
    }

    .cal-month-cell.selected {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .cal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }

    .cal-footer-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card-soft);
      color: var(--text);
      text-align: center;
    }

    .cal-footer-btn.primary {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: var(--text);
    }

    .dim-segmented-mini {
      display: flex;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }

    .dim-mini-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dim-mini-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    /* 2-3: 今日支出精簡橫列（不顯示收入與筆數） */
    .expense-summary-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 2px 2px 2px;
    }

    .expense-label {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .expense-amount {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--expense);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    /* 2-4: 分類佔比條與小標籤 */
    .chart-compact-box {
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chart-bar {
      display: flex;
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--card-soft);
    }

    .bar-seg {
      height: 100%;
      transition: width 0.3s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .cat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: var(--card-soft);
      transition: all 0.15s ease;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .cat-chip:active {
      transform: scale(0.95);
    }

    .cat-chip.active-filter {
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    .cat-chip.dimmed {
      opacity: 0.38;
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .chip-name {
      color: var(--text);
    }

    .chip-val {
      color: var(--text-muted);
    }

    /* =========================================================
       區塊 3：細項區（單行搜尋＋三條線排序選單 ＋ 極簡項目列表）
       ========================================================= */
    .block-3-records-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 13px 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* 3-1: 單行工具列：類別篩選標籤 + 無提示字搜尋框 + 三條線排序按鈕 */
    .toolbar-single-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--card-border);
    }

    .active-cat-filter-badge {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--card-soft);
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-inline-box {
      position: relative;
      flex: 1;
      min-width: 60px;
    }

    .search-inline-input {
      width: 100%;
      height: 34px;
      background: var(--card-soft);
      border: 1px solid var(--card-border);
      border-radius: 9px;
      padding: 0 26px 0 30px;
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
    }

    .search-inline-input:focus {
      border-color: var(--accent);
    }

    .search-inline-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      opacity: 0.75;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .search-inline-clear {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.76rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* 三條線排序按鈕＋點擊彈出文字選單 */
    .sort-menu-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .sort-lines-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--card-border);
      background: var(--card-soft);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sort-lines-btn:hover,
    .sort-lines-btn.open {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.16);
    }

    .sort-dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 4px;
      min-width: 145px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 950;
    }

    .sort-dropdown-menu.open {
      display: flex;
    }

    .sort-menu-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 7px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .sort-menu-item:hover {
      background: var(--card-soft);
      color: var(--text);
    }

    .sort-menu-item.active {
      background: rgba(99, 102, 241, 0.16);
      color: var(--text);
      font-weight: 800;
    }

    /* 搜尋群集面板 */
    .search-summary-bar {
      background: var(--card-soft);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 700;
    }

    .cluster-card {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .cluster-header {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cluster-header:active {
      background: var(--card-soft);
    }

    .cluster-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cluster-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cluster-right {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
      flex-shrink: 0;
    }

    .cluster-total {
      font-size: 1rem;
      font-weight: 800;
      color: var(--expense);
    }

    .cluster-count {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .cluster-arrow {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .cluster-arrow.open {
      transform: rotate(180deg);
    }

    .cluster-body {
      display: none;
      border-top: 1px solid var(--card-border);
      padding: 6px 8px;
      background: var(--card);
    }

    .cluster-body.open {
      display: block;
    }

    /* 3-2: 消費項目列表（適度放寬上下距離 + 質感 SVG 動作按鈕） */
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .record-row-wrap {
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .record-row-wrap:last-child {
      border-bottom: none;
    }

    .record-slim-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 4px;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 9px;
    }

    .record-slim-row:hover {
      background: rgba(148, 163, 184, 0.05);
    }

    .rec-slim-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .cat-icon-sm {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.96rem;
      flex-shrink: 0;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
      cursor: pointer;
    }

    .rec-note-text {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-date-tag {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .rec-slim-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .rec-inline-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .act-icon-xs {
      width: 28px;
      height: 28px;
      border: 1px solid var(--card-border);
      background: var(--card-soft);
      color: var(--text-muted);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
    }

    .act-icon-xs svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .act-icon-xs:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .act-icon-xs:active {
      transform: scale(0.92);
    }

    .act-icon-xs.del:hover {
      color: #ef4444;
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    .rec-amount-clean {
      font-size: 0.96rem;
      font-weight: 900;
      color: var(--text);
      min-width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .rec-amount-clean.income {
      color: var(--income);
    }

    /* 保留除錯中心與展開更多使用的微按鈕 */
    .rec-btn-mini {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .rec-btn-mini:active {
      background: var(--card-soft);
      color: var(--text);
    }

    .rec-btn-mini.del {
      color: #c65d47;
    }

    /* 快速改分類彈出選單 (Sheet Modal) */
    .category-picker-overlay {
      display: none;
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 59, 50, 0.35);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .category-picker-overlay.open {
      display: flex;
      visibility: visible;
      pointer-events: auto;
    }

    .category-sheet {
      background: var(--card);
      border-top: 1px solid var(--card-border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 18px;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -4px 20px rgba(74, 59, 50, 0.12);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 14px;
      text-align: center;
      color: var(--text-muted);
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .cat-grid-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer;
      gap: 5px;
    }

    .cat-grid-btn:active {
      background: var(--card-soft);
    }

    .cat-grid-icon {
      font-size: 1.4rem;
    }

    .cat-grid-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
    }

    /* 手動新增/編輯記帳與欠錢 Modal */
    .edit-modal-overlay {
      display: none;
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 59, 50, 0.38);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .edit-modal-overlay.open {
      display: flex;
      visibility: visible;
      pointer-events: auto;
    }

    .edit-modal {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(74, 59, 50, 0.16);
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .form-input, .form-select {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
    }

    .form-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-submit {
      flex: 1;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 11px 0;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit:active {
      background: #8f6841;
    }

    .btn-cancel {
      flex: 1;
      background: var(--card-soft);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 11px 0;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-quick-half {
      background: var(--accent-soft, #f4ebe1);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-quick-half:hover, .btn-quick-half:active {
      background: var(--accent) !important;
      color: #ffffff !important;
    }

    .btn-del {
      background: #fae5e1;
      color: #c65d47;
      border: 1px solid #eab6ad;
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* 🩺 除錯與重複偵測中心 Modal */
    .audit-modal-overlay {
      display: none;
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 59, 50, 0.38);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 1000;
    }

    .audit-modal-overlay.open {
      display: flex;
      visibility: visible;
      pointer-events: auto;
    }

    .audit-modal-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(74, 59, 50, 0.16);
    }

    .audit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .audit-tabs {
      display: flex;
      background: var(--card-soft);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 12px;
    }

    .audit-tab-btn {
      flex: 1;
      padding: 7px 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }

    .audit-tab-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 5px rgba(74, 59, 50, 0.08);
    }

    .audit-body {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .audit-item {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .audit-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .audit-badge-warn {
      font-size: 0.74rem;
      font-weight: 800;
      color: #b45309;
      background: rgba(217, 119, 6, 0.14);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .audit-item-desc {
      font-size: 0.8rem;
      color: var(--text);
      line-height: 1.4;
    }

    .audit-item-btns {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      justify-content: flex-end;
    }

    /* ➕ 右下角懸浮新增按鈕 (畫面滑動時固定於右下角) */
    .fab-add-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      border: 2px solid var(--card);
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 900;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .fab-add-btn:active {
      transform: scale(0.92);
    }

    /* 🎯 每月預算進度條（位於誰的記帳與天/月/年之間） */
    .monthly-budget-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .monthly-budget-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .monthly-budget-title {
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .monthly-budget-values {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .monthly-budget-track {
      position: relative;
      width: 100%;
      height: 22px;
      background: var(--card-soft);
      border-radius: 99px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .monthly-budget-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
      opacity: 0.42;
      border-radius: 99px;
      transition: width 0.35s ease, background 0.25s ease;
    }

    .monthly-budget-bar-text {
      position: relative;
      z-index: 1;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.2px;
      line-height: 1;
    }

    /* ⚙️ 設定 Modal 內的摺疊選單欄位 */
    .settings-accordion {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .settings-sec-item {
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      background: var(--bg);
      overflow: hidden;
    }

    .settings-sec-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.93rem;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }

    .settings-sec-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .settings-sec-arrow {
      font-size: 0.75rem;
      transition: transform 0.2s ease;

      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--card-border);

    /* ⚙️ 設定 Modal 內的色系選擇列表 */
    .theme-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .theme-option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .theme-option-btn.active {
      border-color: var(--accent);
      background: var(--card-soft);
    }

    .theme-option-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-swatch-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .theme-swatch-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.35);
    }

    /* =========================================================
       📊 週報 / 月報消費對比分析 Modal 樣式
       ========================================================= */
    .report-modal-overlay {
      display: none;
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: -120px;
      width: 100vw;
      min-height: calc(100vh + 120px);
      min-height: calc(-webkit-fill-available + 120px);
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: flex-start;
      justify-content: center;
      z-index: 1500;
      padding: 12px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 26px) !important;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px) !important;
      box-sizing: border-box;
    }

    .report-modal-overlay.open {
      display: flex;
      visibility: visible;
      pointer-events: auto;
    }

    .report-modal-box {
      width: 100%;
      max-width: 450px;
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 60px);
      max-height: calc(-webkit-fill-available - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 60px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.48);

      display: flex;
      flex-direction: column;
      gap: 13px;

    .report-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .report-title-grp {

      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 900;
    }

    .report-seg-tabs {

      gap: 3px;

    .report-seg-btn {

    .report-period-nav {

    .rep-metric-tile-val {

    .rep-swing-row {

    .rep-swing-row.up { color: #ef4444; }

    [data-theme="cyberpunk"] .rep-swing-row.up { color: #f87171; }
    [data-theme="dark"] .rep-swing-row.down,
    [data-theme="cyberpunk"] .rep-swing-row.down { color: #4ade80; }

    /* 點擊類別展開的消費明細抽屜 */
    .rep-cat-delta-item {
      display: flex;

      gap: 4px;

    .rep-cat-records-drawer {

    .rep-cat-delta-item.expanded .rep-cat-records-drawer {
      display: flex;
    }

    .rep-cat-rec-mini-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 6px;
      border-radius: 6px;

    .rep-cat-rec-mini-row:hover {
      border-color: var(--accent);

    }

    .rep-clickable-card {
      cursor: pointer;

      border-color: var(--accent);
    }

    .rep-clickable-card:active {
      transform: scale(0.98);

    .rep-section-card {
      background: var(--card-soft);

      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .rep-sec-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .rep-sec-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .rep-bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 112px;
      padding-top: 18px;
      gap: 6px;
      border-bottom: 1px solid var(--card-border);
      width: 100%;
      box-sizing: border-box;
    }

    .rep-bar-chart.yearly {
      gap: 1.5px;
      padding-left: 1px;
      padding-right: 1px;
    }

    .rep-bar-chart.yearly .rep-bar-col {
      flex: 1 1 0;
      min-width: 0;
      padding: 2px 0 0;
      gap: 2px;
    }

    .rep-bar-chart.yearly .rep-bar-val {
      font-size: 0.44rem;
      letter-spacing: -0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      max-width: 100%;
      text-align: center;
      line-height: 1.1;
    }

    .rep-bar-chart.yearly .rep-bar-lbl {
      font-size: 0.52rem;
      letter-spacing: -0.4px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .rep-bar-chart.yearly .rep-bar-fill {
      width: 100%;
      max-width: 12px;
      border-radius: 3px 3px 1px 1px;
    }

    .rep-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 4px;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 1px 0;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .rep-bar-col:hover,
    .rep-bar-col.active-bar {
      background: var(--bg);
    }

    .rep-bar-col.active-bar {
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    .rep-bar-val {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .rep-bar-val.dim {
      opacity: 0.35;
    }

    .rep-bar-fill {
      width: 100%;
      max-width: 26px;
      border-radius: 6px 6px 2px 2px;
      background: var(--accent);
      opacity: 0.75;
      transition: height 0.25s ease;
      min-height: 4px;
    }

    .rep-bar-fill.peak {
      background: #f97316;
      opacity: 1;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.38);
    }

    .rep-bar-fill.zero {
      background: rgba(148, 163, 184, 0.22);
      height: 4px !important;
    }

    .rep-bar-lbl {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      padding-top: 4px;
    }

    .rep-bar-col.today .rep-bar-lbl {
      color: var(--accent);
      font-weight: 900;
      background: rgba(99, 102, 241, 0.14);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 月報 SVG 曲線走勢圖與 Y 軸樣式 */
    .rep-curve-card-wrapper {
      display: flex;
      align-items: stretch;
      gap: 6px;
      padding: 6px 0 4px;
      border-bottom: 1px solid var(--card-border);

    .rep-y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;

    .rep-cat-delta-list {
      display: flex;

    .rep-cat-delta-item {
      display: flex;
      flex-direction: column;

<body>
  <!-- 🚀 全螢幕流動霓虹光暈外框 (重新整理、編輯、刪除進行時轉動) -->
  <div class="screen-neon-border" id="screen-neon-border"></div>

  <!-- =========================================================
       區塊 1：頂部列（切換是誰 / 單人名稱 ＋ 財報分析、重新整理、除錯偵測、頁面設定）
       ========================================================= -->
  <div class="top-bar">
    <div class="user-pill-group" id="user-toggle-pill-group">
      <button class="user-pill active-ding" id="pill-ding" onclick="switchUser('定成')">定成</button>
      <button class="user-pill" id="pill-yu" onclick="switchUser('妤珊')">妤珊</button>
    </div>
    <div class="locked-user-title" id="locked-user-title">
      <span id="locked-user-name">定成</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="openReportModal('weekly')" title="週報 / 月報消費比較分析">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </button>
      <button class="icon-btn" id="btn-refresh" onclick="triggerManualRefresh()" title="重新整理最新資料">
        <span>
          <svg viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </span>

      <button class="icon-btn" onclick="openAuditCenter()" title="除錯與重複偵測">

          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    // 自動將原本 Apps Script 專用的 google.script.run 轉接為標準跨網域 fetch API
    if (typeof window.google === "undefined" || !window.google.script) {
      function createGasRunner(successHandler, failureHandler) {
        function callGasApi(payload, extractField) {
          fetch(GAS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          })
            .then(function(res) { return res.json(); })
            .then(function(json) {
              if (json && json.success === false) {
                if (failureHandler) failureHandler(new Error(json.message || "操作失敗"));
                return;
              }
              const resultData = extractField ? json[extractField] : json;
              // 若成功抓回儀表板資料，順便快取至瀏覽器本地，讓下次打開 GitHub 網頁 0.01 秒瞬間顯示！
              if (payload.action === "getDashboardData" && resultData && resultData.allRecords) {
                try {
                  localStorage.setItem("github_fast_dash_cache_v2", JSON.stringify(resultData));
                } catch (e) {}
              }
              if (successHandler) successHandler(resultData);
            })
            .catch(function(err) {
              if (failureHandler) failureHandler(err);
            });
        }

        return {
          withSuccessHandler: function(fn) { return createGasRunner(fn, failureHandler); },
          withFailureHandler: function(fn) { return createGasRunner(successHandler, fn); },
          getDashboardData: function(params) {
            callGasApi(Object.assign({ action: "getDashboardData" }, params || {}), "data");
          },
          addStructuredRecord: function(record) {
            callGasApi({ action: "addRecord", record: record, user: record && record.user }, "record");
          },
          updateStructuredRecord: function(user, rowIndex, record, matchCriteria) {
            callGasApi({ action: "updateRecord", user: user, rowIndex: rowIndex, record: record, matchCriteria: matchCriteria }, "record");
          },
          deleteRecordByRow: function(user, rowIndex, matchCriteria) {
            callGasApi({ action: "deleteRecord", user: user, rowIndex: rowIndex, matchCriteria: matchCriteria });
          },
          splitRecordAndSyncDebt: function(user, rowIndex, splitAmount, matchCriteria) {
            callGasApi({ action: "splitRecordAndSyncDebt", user: user, rowIndex: rowIndex, splitAmount: splitAmount, matchCriteria: matchCriteria });
          },
          splitLatestExpenseForBoth: function(payer, splitAmount, note, isHalf) {
            callGasApi({ action: "splitExpense", payer: payer, splitAmount: splitAmount, note: note, isHalf: !!isHalf });
          },
          recordCashExpenseAndDebtSplit: function(payer, totalAmount, payerAmount, note, isHalf) {
            callGasApi({ action: "cashSplit", payer: payer, totalAmount: totalAmount, payerAmount: payerAmount, note: note, isHalf: !!isHalf });
          },
          saveUserSettings: function(user, settings) {
            callGasApi({ action: "saveUserSettings", user: user, settings: settings }, "settings");
          },
          scanDuplicatesAndAnomalies: function(days, user) {
            callGasApi({ action: "scanDuplicatesAndAnomalies", days: days, user: user }, "report");
          }
        };
      }
      window.google = {
        script: {
          run: createGasRunner(null, null)
        }
      };
    }

    // 10 大分類與專屬圖標與色彩

    // 🧹 防呆清理備註：防止試算表將「7-11」等商品誤存為 Date 物件字串（如 "Sat Jul 11 2026 00:00:00 GMT+0800..."）
    function normalizeRecordNote(noteStr) {
      if (!noteStr) return "";
      const s = String(noteStr).trim();
      if (/Jul\s+11\s+2026.*(?:GMT|台北標準時間)/i.test(s) || s.startsWith("Sat Jul 11 2026")) {
        return "7-11";
      }
      const gmtMatch = s.match(/^[A-Za-z]{3}\s+([A-Za-z]{3})\s+(\d{1,2})\s+\d{4}\s+00:00:00/);
      if (gmtMatch) {
        const monthMap = { Jan:1, Feb:2, Mar:3, Apr:4, May:5, Jun:6, Jul:7, Aug:8, Sep:9, Oct:10, Nov:11, Dec:12 };
        const mNum = monthMap[gmtMatch[1]];
        if (mNum) {
          return (mNum === 7 && parseInt(gmtMatch[2], 10) === 11) ? "7-11" : `${mNum}-${parseInt(gmtMatch[2], 10)}`;
        }
      }
      return s;
    }

    function normalizeRecords(records) {
      if (!Array.isArray(records)) return [];

      return records;
    }

    // 初始化服務端資料注入（GitHub Pages 極速版：0.01 秒先顯示本地快取畫面，同時背景向 Google Sheet 同步最新資料）
    window.onload = function() {
      // 📱 PWA / iOS 獨立主畫面防遮擋與快取自動更新機制（向上微調）

      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {

      }
      // 支援網址帶 ?user=定成 或 ?user=妤珊 鎖定專屬個人頁面
      const urlParams = new URLSearchParams(window.location.search);

      if (urlUser && (urlUser.indexOf("妤珊") !== -1 || urlUser.indexOf("珊") !== -1)) {

        searchEl.addEventListener("search", function(e) { onSearchInput(e.target.value); });

      // 1. 先從本地快取 0.01 秒瞬間渲染上次畫面（完全不白畫面等待）
      try {
        const cachedRaw = localStorage.getItem("github_fast_dash_cache_v2");
        if (cachedRaw) {
          const cachedData = JSON.parse(cachedRaw);
          if (cachedData && cachedData.monthlyExpenses) {

        }
      } catch (e) {}

      // 2. 接著立即向 Google Apps Script 抓取最新 15 筆紀錄與最新設定

    // 🩺 背景靜態檢查：若發現有重複或錯誤則亮起紅色橫幅，但只要點開查看過就會消失！
    function checkRecentAuditIssues() {

        .withSuccessHandler(function(report) {
          if (!report) return;
          const issues = report.issues || [];
          const total = issues.length;
          const banner = document.getElementById("main-alert-banner");

    function setDefaultTimeKey() {

      const todayStr = getTodayString();
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");

      if (currentDimension === "day") {
        currentTimeKey = todayStr;
      } else if (currentDimension === "month") {
        currentTimeKey = `${y}/${m}`;

    function switchUser(user) {

      currentUser = user;

      document.getElementById("pill-yu").className = "user-pill" + (user === "妤珊" ? " active-yu" : "");
      applyUserTheme(user);
      if (isChangingUser && allRecords && allRecords.length > 0) {
        const hasRecordInCurrentPeriod = getFilteredRecords().length > 0;
        if (!hasRecordInCurrentPeriod) {
          setDefaultTimeKey();

      // 智慧轉換時間 Key
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");

      if (dim === "day") {
        currentTimeKey = (currentTimeKey !== "ALL" && currentTimeKey.length >= 10) ? currentTimeKey : `${y}/${m}/${d}`;
      } else if (dim === "month") {

        if (!isMonthHistoryLoaded && !isFullHistoryLoaded) {

      } else if (dim === "year") {
        currentTimeKey = currentTimeKey === "ALL" ? "ALL" : (currentTimeKey.slice(0, 4) || `${y}`);

    // 核心資料計算與畫面渲染
    function refreshView() {
      const fabBtn = document.getElementById("fab-add-btn");
      if (fabBtn) {

      // 1. 篩選出符合 當前使用者 + 當前時間維度 的資料

        if (currentDimension === "day") {
          return recDate.slice(0, 10) === currentTimeKey;
        } else if (currentDimension === "month") {

          return currentTimeKey === "ALL" ? true : (recDate.slice(0, 4) === currentTimeKey);
        }
        return false;
      });

      // 2. 統計總支出、總收入與分類佔比

      // 6. 若週報/月報彈窗正在開啟中，同步即時更新圖表

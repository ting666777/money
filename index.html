      document.getElementById("form-category").value = "食物";
      document.getElementById("form-account").value = "現金";

      // 依當前畫面所在的「天」日期 + 當下紀錄的時分 (HH:mm) 預設時間
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const targetDateStr = (/^\d{4}\/\d{2}\/\d{2}$/.test(currentTimeKey))
        ? currentTimeKey.replace(/\//g, "-")
        : getTodayString().replace(/\//g, "-");
      document.getElementById("form-time").value = `${targetDateStr}T${hh}:${mm}`;

      document.getElementById("form-del-btn").style.display = "none";
      document.getElementById("edit-modal").classList.add("open");
    }

    function openEditModal(index) {
      const rec = renderedRecordsPool[index] || getFilteredRecords()[index];
      if (!rec) return;
      openEditModalWithRecordObj(rec);
    }

    function openEditModalWithRecordObj(rec) {
      editingModalMatchCriteria = {
        recordedAt: rec["Recorded At"] || rec.recordedAt || "",
        amount: rec.Amount !== undefined ? rec.Amount : rec.amount,
        note: rec.note || ""
      };
      editingModalAccountId = Number(rec["Account ID"] !== undefined ? rec["Account ID"] : (rec.accountId || 0));

      document.getElementById("modal-heading").innerText = `修改記帳 (${rec.user})`;
      document.getElementById("form-row-index").value = rec.rowIndex;
      document.getElementById("form-user").value = rec.user;
      document.getElementById("form-note").value = rec.note || "";
      document.getElementById("form-amount").value = rec.Amount !== undefined ? rec.Amount : rec.amount;
      document.getElementById("form-category").value = rec.Category || rec.category || "食物";
      document.getElementById("form-account").value = rec.Account || rec.account || "現金";

      // 轉換 Recorded At 為 datetime-local 格式 (yyyy-MM-ddTHH:mm)
      const rawTime = String(rec["Recorded At"] || rec.recordedAt || "");
      const isoFormat = rawTime.replace(/\//g, "-").replace(" ", "T").slice(0, 16);
      document.getElementById("form-time").value = isoFormat;

      document.getElementById("form-del-btn").style.display = "block";
      document.getElementById("edit-modal").classList.add("open");
    }

    function closeEditModal() {
      document.getElementById("edit-modal").classList.remove("open");
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const rowIndex = document.getElementById("form-row-index").value;
      const user = document.getElementById("form-user").value || currentUser;
      const note = document.getElementById("form-note").value.trim();
      const amount = parseFloat(document.getElementById("form-amount").value);
      const category = document.getElementById("form-category").value;
      const account = document.getElementById("form-account").value;
      const timeVal = document.getElementById("form-time").value;
      const recordedAt = timeVal.replace("T", " ").replace(/-/g, "/");

      const saveBtn = document.getElementById("form-save-btn");
      saveBtn.disabled = true;
      saveBtn.innerText = "儲存中...";

      const payload = {
        user: user,
        Account: account,
        Category: category,
        Amount: amount,
        Currency: "TWD",
        "Recorded At": recordedAt,
        note: note,
        "Account ID": editingModalAccountId || 0
      };

      startProgress();

      if (rowIndex) {
        google.script.run
          .withSuccessHandler(function() {
            closeEditModal();
            saveBtn.disabled = false;
            saveBtn.innerText = "儲存";
            if (currentDimension === "day" && recordedAt.length >= 10) {
              currentTimeKey = recordedAt.slice(0, 10);
            }
            triggerManualRefresh();
          })
          .withFailureHandler(function(err) {
            finishProgress();
            saveBtn.disabled = false;
            saveBtn.innerText = "儲存";
            alert("修改失敗：" + err.message);
          })
          .updateStructuredRecord(user, rowIndex, payload, editingModalMatchCriteria);
      } else {
        google.script.run
          .withSuccessHandler(function() {
            closeEditModal();
            saveBtn.disabled = false;
            saveBtn.innerText = "儲存";
            if (currentDimension === "day" && recordedAt.length >= 10) {
              currentTimeKey = recordedAt.slice(0, 10);
            }
            triggerManualRefresh();
          })
          .withFailureHandler(function(err) {
            finishProgress();
            saveBtn.disabled = false;
            saveBtn.innerText = "儲存";
            alert("新增失敗：" + err.message);
          })
          .addStructuredRecord(payload);
      }
    }

    function handleDeleteCurrentRecord() {
      const rowIndex = document.getElementById("form-row-index").value;
      const user = document.getElementById("form-user").value || currentUser;
      const criteria = editingModalMatchCriteria || {
        recordedAt: document.getElementById("form-time").value.replace("T", " ").replace(/-/g, "/"),
        amount: parseFloat(document.getElementById("form-amount").value),
        note: document.getElementById("form-note").value.trim()
      };

      if (!rowIndex || !confirm("確定要刪除這筆記帳紀錄嗎？")) return;

      const delBtn = document.getElementById("form-del-btn");
      delBtn.innerText = "刪除中...";
      delBtn.disabled = true;
      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          delBtn.innerText = "🗑️";
          delBtn.disabled = false;
          closeEditModal();
          triggerManualRefresh();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          delBtn.innerText = "🗑️";
          delBtn.disabled = false;
          alert("刪除失敗：" + err.message);
        })
        .deleteRecordByRow(user, rowIndex, criteria);
    }

    // =====================================================
    // 欠錢 Modal 操作 (指定任一筆消費拆帳 + 寫入欠款 LINE Bot)
    // =====================================================
    function openDebtSplitModal(poolIndex) {
      const rec = renderedRecordsPool[poolIndex] || getFilteredRecords()[poolIndex];
      if (!rec) return;
      currentDebtSplitRecord = rec;

      const payer = rec.user || currentUser;
      const totalAmt = Number(rec.Amount) || 0;
      const noteText = rec.note || rec.Category || "消費";

      document.getElementById("debt-modal-heading").innerText = `欠錢 (${payer})`;
      document.getElementById("debt-modal-input-label").innerText = `${noteText} ($${totalAmt}) — 金額`;

      const inp = document.getElementById("debt-split-amount");
      inp.max = totalAmt;
      inp.value = "";

      document.getElementById("split-debt-modal").classList.add("open");
      setTimeout(() => { inp.focus(); }, 80);
    }

    function closeDebtSplitModal() {
      document.getElementById("split-debt-modal").classList.remove("open");
      currentDebtSplitRecord = null;
    }

    function handleDebtSplitSubmit(e) {
      e.preventDefault();
      if (!currentDebtSplitRecord) return;
      const rec = currentDebtSplitRecord;
      const splitAmt = Math.round(parseFloat(document.getElementById("debt-split-amount").value));
      const totalAmt = Number(rec.Amount) || 0;

      if (isNaN(splitAmt) || splitAmt <= 0 || splitAmt > totalAmt) {
        alert(`請輸入 1 ~ ${totalAmt} 之間的金額`);
        return;
      }

      const btn = document.getElementById("debt-save-btn");
      btn.disabled = true;
      btn.innerText = "儲存中...";
      startProgress();

      const criteria = {
        recordedAt: rec["Recorded At"],
        amount: rec.Amount,
        note: rec.note
      };

      google.script.run
        .withSuccessHandler(function() {
          btn.disabled = false;
          btn.innerText = "儲存";
          closeDebtSplitModal();
          triggerManualRefresh();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          btn.disabled = false;
          btn.innerText = "儲存";
          alert("失敗：" + err.message);
        })
        .splitRecordAndSyncDebt(rec.user, rec.rowIndex, splitAmt, criteria);
    }

    // 快捷刪除按鈕
    function quickDeleteRecord(recordIndex) {
      const rec = renderedRecordsPool[recordIndex] || getFilteredRecords()[recordIndex];
      if (!rec) return;
      if (!confirm(`確定要刪除【${rec.note || rec.Category}】$${rec.Amount} 的紀錄嗎？`)) return;

      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          triggerManualRefresh();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          alert("刪除失敗：" + err.message);
        })
        .deleteRecordByRow(rec.user, rec.rowIndex, {
          recordedAt: rec["Recorded At"],
          amount: rec.Amount,
          note: rec.note
        });
    }

    function getFilteredRecords() {
      return allRecords.filter(r => {
        if (r.user !== currentUser) return false;
        const recDate = String(r["Recorded At"] || "");
        if (currentDimension === "day") return recDate.slice(0, 10) === currentTimeKey;
        if (currentDimension === "month") return recDate.slice(0, 7) === currentTimeKey;
        if (currentDimension === "year") return currentTimeKey === "ALL" ? true : (recDate.slice(0, 4) === currentTimeKey);
        return false;
      });
    }

    function startProgress() {
      // 啟動全螢幕流動霓虹光暈外框轉圈圈
      const neon = document.getElementById("screen-neon-border");
      if (neon) neon.classList.add("active");
    }

    function finishProgress() {
      // 關閉全螢幕流動霓虹光暈外框
      const neon = document.getElementById("screen-neon-border");
      if (neon) neon.classList.remove("active");
    }

    function triggerManualRefresh() {
      const btn = document.getElementById("btn-refresh");
      btn.classList.add("spinning");
      startProgress();
      // 三段式載入：搜尋或看「年」載入全部，看「月」或非今日的「天」載入 200 筆，看今日「天」只極速撈取最新 15 筆
      let fetchParams = { user: currentUser, limit: 15 };
      if (searchQuery.length > 0 || currentDimension === "year") {
        fetchParams = { user: currentUser, all: true };
      } else if (currentDimension === "month" || isMonthHistoryLoaded || currentTimeKey !== getTodayString()) {
        fetchParams = { user: currentUser, limit: 200 };
      }
      google.script.run
        .withSuccessHandler(function(data) {
          btn.classList.remove("spinning");
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.userSettings) {
            syncUserSettingsFromServer(data.userSettings);
          }
          if (data && data.allRecords) {
            allRecords = data.allRecords;
            isFullHistoryLoaded = !!data.isCompleteHistory;
            isMonthHistoryLoaded = isFullHistoryLoaded || (fetchParams.limit >= 200);
            refreshView();
          }
        })
        .withFailureHandler(function(err) {
          btn.classList.remove("spinning");
          finishProgress();
          alert("重新整理失敗：" + err.message);
        })
        .getDashboardData(fetchParams);
    }

    function loadDataFromServer() {
      startProgress();
      let fetchParams = { user: currentUser, limit: 15 };
      if (searchQuery.length > 0 || currentDimension === "year") {
        fetchParams = { user: currentUser, all: true };
      } else if (currentDimension === "month") {
        fetchParams = { user: currentUser, limit: 200 };
      }
      google.script.run
        .withSuccessHandler(function(data) {
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.userSettings) {
            syncUserSettingsFromServer(data.userSettings);
          }
          if (data && data.allRecords) {
            allRecords = data.allRecords;
            isFullHistoryLoaded = !!data.isCompleteHistory;
            isMonthHistoryLoaded = isFullHistoryLoaded || (fetchParams.limit >= 200);
            setDefaultTimeKey();
            refreshView();
          }
        })
        .withFailureHandler(function() {
          finishProgress();
        })
        .getDashboardData(fetchParams);
    }

    // =====================================================
    // ⚙️ 頁面設定（背景色系 + 個人每月預算，同步寫入 Google Sheet「頁面設定」工作表）
    // =====================================================
    const VALID_THEMES = ["dark", "white", "milktea", "pink", "cyberpunk"];
    const THEME_NAME_MAP = {
      "dark": "原本深色系",
      "white": "白色系",
      "milktea": "奶茶色系",
      "pink": "粉色系",
      "cyberpunk": "賽博朋克色系"
    };

    function syncUserSettingsFromServer(serverSettings) {
      if (!serverSettings) return;
      ["定成", "妤珊"].forEach(u => {
        if (!userSettingsMap[u]) {
          userSettingsMap[u] = { theme: u === "妤珊" ? "milktea" : "dark", monthlyBudget: 0 };
        }
        if (serverSettings[u]) {
          if (serverSettings[u].theme) {
            userSettingsMap[u].theme = serverSettings[u].theme;
            try { localStorage.setItem("theme_" + u, serverSettings[u].theme); } catch (e) {}
          }
          if (serverSettings[u].monthlyBudget !== undefined) {
            const b = parseFloat(serverSettings[u].monthlyBudget);
            const cleanBudget = (!isNaN(b) && b >= 0) ? Math.round(b) : 0;
            userSettingsMap[u].monthlyBudget = cleanBudget;
            try { localStorage.setItem("budget_" + u, String(cleanBudget)); } catch (e) {}
          }
        }
      });
      applyUserTheme(currentUser);
      renderMonthlyBudgetBar();
    }

    function applyUserTheme(user) {
      const targetUser = user || currentUser;
      const defaultTheme = targetUser === "妤珊" ? "milktea" : "dark";
      const userCfg = userSettingsMap[targetUser] || {};
      const currentTheme = userCfg.theme || defaultTheme;
      const safeTheme = VALID_THEMES.indexOf(currentTheme) !== -1 ? currentTheme : defaultTheme;

      document.body.setAttribute("data-theme", safeTheme);

      VALID_THEMES.forEach(t => {
        const btn = document.getElementById("theme-btn-" + t);
        if (btn) {
          btn.className = "theme-option-btn" + (t === safeTheme ? " active" : "");
        }
      });

      const themeLabelEl = document.getElementById("settings-current-theme-label");
      if (themeLabelEl) {
        themeLabelEl.innerText = THEME_NAME_MAP[safeTheme] || "原本深色系";
      }

      const budgetVal = Number(userCfg.monthlyBudget) || 0;
      const budgetLabelEl = document.getElementById("settings-current-budget-label");
      if (budgetLabelEl) {
        budgetLabelEl.innerText = budgetVal > 0 ? `$${budgetVal.toLocaleString()}` : "未設定";
      }
    }

    function openSettingsModal(expandTarget) {
      document.getElementById("settings-modal-heading").innerText = `⚙️ 頁面設定 (${currentUser})`;
      applyUserTheme(currentUser);

      const userCfg = userSettingsMap[currentUser] || {};
      const budgetVal = Number(userCfg.monthlyBudget) || 0;
      const budgetInput = document.getElementById("settings-budget-input");
      if (budgetInput) {
        budgetInput.value = budgetVal > 0 ? budgetVal : "";
      }

      // 預設兩個欄位皆收合，點選對應欄位才展開；若從首頁預算進度條點進來則直接展開預算欄
      const themeItem = document.getElementById("settings-item-theme");
      const budgetItem = document.getElementById("settings-item-budget");
      if (themeItem) themeItem.classList.remove("open");
      if (budgetItem) budgetItem.classList.remove("open");

      if (expandTarget === "budget" && budgetItem) {
        budgetItem.classList.add("open");
        setTimeout(() => { if (budgetInput) budgetInput.focus(); }, 80);
      } else if (expandTarget === "theme" && themeItem) {
        themeItem.classList.add("open");
      }

      document.getElementById("settings-modal").classList.add("open");
    }

    function toggleSettingsSection(secKey) {
      const itemEl = document.getElementById("settings-item-" + secKey);
      if (!itemEl) return;
      const willOpen = !itemEl.classList.contains("open");
      itemEl.classList.toggle("open", willOpen);
      if (willOpen && secKey === "budget") {
        const inp = document.getElementById("settings-budget-input");
        setTimeout(() => { if (inp) inp.focus(); }, 60);
      }
    }

    function closeSettingsModal() {
      document.getElementById("settings-modal").classList.remove("open");
    }

    function selectTheme(themeKey) {
      if (VALID_THEMES.indexOf(themeKey) === -1) return;
      const user = currentUser;
      if (!userSettingsMap[user]) userSettingsMap[user] = { theme: themeKey, monthlyBudget: 0 };
      userSettingsMap[user].theme = themeKey;
      try {
        localStorage.setItem("theme_" + user, themeKey);
      } catch (e) {}

      applyUserTheme(user);
      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          finishProgress();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          alert("設定儲存失敗：" + err.message);
        })
        .saveUserSettings(user, { theme: themeKey });
    }

    function saveMonthlyBudget() {
      const user = currentUser;
      const inp = document.getElementById("settings-budget-input");
      const rawVal = inp ? inp.value.trim() : "";
      const parsed = rawVal === "" ? 0 : Math.round(parseFloat(rawVal));

      if (isNaN(parsed) || parsed < 0) {
        alert("請輸入有效的預算金額（輸入 0 代表不設預算）");
        return;
      }

      if (!userSettingsMap[user]) {
        userSettingsMap[user] = { theme: user === "妤珊" ? "milktea" : "dark", monthlyBudget: 0 };
      }
      userSettingsMap[user].monthlyBudget = parsed;
      try {
        localStorage.setItem("budget_" + user, String(parsed));
      } catch (e) {}

      applyUserTheme(user);
      renderMonthlyBudgetBar();

      const btn = document.getElementById("settings-budget-save-btn");
      if (btn) {
        btn.disabled = true;
        btn.innerText = "儲存中...";
      }
      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          finishProgress();
          if (btn) {
            btn.disabled = false;
            btn.innerText = "儲存";
          }
          const budgetItem = document.getElementById("settings-item-budget");
          if (budgetItem) budgetItem.classList.remove("open");
        })
        .withFailureHandler(function(err) {
          finishProgress();
          if (btn) {
            btn.disabled = false;
            btn.innerText = "儲存";
          }
          alert("預算儲存失敗：" + err.message);
        })
        .saveUserSettings(user, { monthlyBudget: parsed });
    }

    // ⚡ 第二段載入：點選「月」或往前翻閱幾天時，只快速載入最新 200 筆（涵蓋近兩個月）
    function loadMonthHistoryFromServer() {
      if (isLoadingMonthHistory || isMonthHistoryLoaded || isFullHistoryLoaded) return;
      isLoadingMonthHistory = true;
      startProgress();
      google.script.run
        .withSuccessHandler(function(data) {
          isLoadingMonthHistory = false;
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.allRecords) {
            allRecords = data.allRecords;
            isMonthHistoryLoaded = true;
            refreshView();
          }
        })
        .withFailureHandler(function() {
          isLoadingMonthHistory = false;
          finishProgress();
        })
        .getDashboardData({ user: currentUser, limit: 200 });
    }

    // ⚡ 第三段載入：當點選「年」、搜尋關鍵字或查詢更早歷史時，背景載入完整歷史紀錄
    function loadFullHistoryFromServer() {
      if (isLoadingFullHistory || isFullHistoryLoaded) return;
      isLoadingFullHistory = true;
      startProgress();
      google.script.run
        .withSuccessHandler(function(data) {
          isLoadingFullHistory = false;
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.allRecords) {
            allRecords = data.allRecords;
            isMonthHistoryLoaded = true;
            isFullHistoryLoaded = true;
            refreshView();
          }
        })
        .withFailureHandler(function() {
          isLoadingFullHistory = false;
          finishProgress();
        })
        .getDashboardData({ user: currentUser, all: true });
    }

    // =====================================================
    // 🩺 除錯與重複偵測中心操作（點開查看後紅色警告立即消失！）
    // =====================================================
    let currentAuditDays = 7;

    function openAuditCenter() {
      // ✅ 點開查看後，紅色橫幅與紅點立即消失！
      hasViewedAuditBanner = true;
      document.getElementById("main-alert-banner").style.display = "none";
      document.getElementById("audit-badge").style.display = "none";
      try {
        if (lastAuditIssueSig) {
          localStorage.setItem("dismissed_audit_sig", lastAuditIssueSig);
        }
      } catch (e) {}

      document.getElementById("audit-modal").classList.add("open");
      runAuditWithDays(currentAuditDays);
    }

    function closeAuditModal() {
      document.getElementById("audit-modal").classList.remove("open");
    }

    function runAuditWithDays(days) {
      currentAuditDays = days;
      document.getElementById("audit-tab-7").className = "audit-tab-btn" + (days === 7 ? " active" : "");
      document.getElementById("audit-tab-30").className = "audit-tab-btn" + (days === 30 ? " active" : "");
      document.getElementById("audit-tab-all").className = "audit-tab-btn" + (days === "ALL" ? " active" : "");

      const box = document.getElementById("audit-results-container");
      box.innerHTML = `<div class="empty-msg">⏳ 正在掃描 ${days === "ALL" ? "全部歷史" : `近 ${days} 天`} 的重複與異常資料...</div>`;

      google.script.run
        .withSuccessHandler(function(report) {
          const issues = (report && report.issues) ? report.issues : [];
          lastAuditIssues = issues;

          // 儲存目前已看過的異常簽名，確保點開查看後紅色警告不再亮起
          const sig = issues.map(x => `${x.user}_${x.rowIndex}_${x.recordedAt}_${x.amount}`).join("|");
          lastAuditIssueSig = sig;
          try {
            localStorage.setItem("dismissed_audit_sig", sig);
          } catch (e) {}
          document.getElementById("audit-badge").style.display = "none";
          document.getElementById("main-alert-banner").style.display = "none";

          if (issues.length === 0) {
            box.innerHTML = `
              <div style="background:rgba(74,140,111,0.12); border:1px solid #4a8c6f; border-radius:12px; padding:20px; text-align:center; color:#386e56;">
                <div style="font-size:2rem; margin-bottom:6px;">✅</div>
                <strong style="font-size:0.92rem;">沒有發現任何重複或異常資料！</strong>
              </div>
            `;
            return;
          }

          let html = `<div style="font-weight:800; font-size:0.85rem; color:#b45309; margin-bottom:8px;">⚠️ 發現 ${issues.length} 筆重複 / 疑似相近消費：</div>`;
          html += issues.map((item, idx) => `
            <div class="audit-item">
              <div class="audit-item-top">
                <span class="audit-badge-warn">[${escapeHtml(item.user)}] ${escapeHtml(item.type)}</span>
                <span style="font-size:0.75rem; color:var(--text-muted);">第 ${item.rowIndex} 列</span>
              </div>
              <div class="audit-item-desc">${escapeHtml(item.reason)}</div>
              <div class="audit-item-btns">
                <button type="button" class="rec-btn-mini" onclick="editAuditItem(${idx})">✏️ 編輯</button>
                <button type="button" class="rec-btn-mini del" onclick="deleteDuplicateItem(${idx})">🗑️ 刪除此筆</button>
              </div>
            </div>
          `).join("");

          box.innerHTML = html;
        })
        .withFailureHandler(function(err) {
          box.innerHTML = `<div class="empty-msg" style="color:#ef4444;">❌ 掃描失敗：${escapeHtml(err.message)}</div>`;
        })
        .scanDuplicatesAndAnomalies(days, currentUser);
    }

    function editAuditItem(issueIdx) {
      const item = lastAuditIssues[issueIdx];
      if (!item) return;
      closeAuditModal();
      openEditModalWithRecordObj({
        user: item.user,
        rowIndex: item.rowIndex,
        Account: item.account || "現金",
        "Account ID": item.accountId || 0,
        Category: item.category || "食物",
        Amount: item.amount,
        "Recorded At": item.recordedAt,
        note: item.note || ""
      });
    }

    function deleteDuplicateItem(issueIdx) {
      const item = lastAuditIssues[issueIdx];
      if (!item) return;
      if (!confirm(`確定要刪除【${item.user}】第 ${item.rowIndex} 列（${item.note} $${item.amount}）的重複紀錄嗎？`)) return;

      startProgress();
      google.script.run
        .withSuccessHandler(function() {
          finishProgress();
          triggerManualRefresh();
          runAuditWithDays(currentAuditDays);
        })
        .withFailureHandler(function(err) {
          finishProgress();
          alert("刪除失敗：" + err.message);
        })
        .deleteRecordByRow(item.user, item.rowIndex, {
          recordedAt: item.recordedAt,
          amount: item.amount,
          note: item.note
        });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>

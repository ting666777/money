    // 渲染個人每月預算進度條（位於誰的記帳與天/月/年之間）
    function renderMonthlyBudgetBar() {
      const todayStr = getTodayString(); // yyyy/MM/dd
      const currentRealMonth = todayStr.slice(0, 7);
      const targetMonth = (currentTimeKey && currentTimeKey.length >= 7)
        ? currentTimeKey.slice(0, 7)
        : currentRealMonth;
      const parts = targetMonth.split("/");
      const yearNum = parseInt(parts[0], 10) || new Date().getFullYear();
      const monthNum = parseInt(parts[1], 10) || (new Date().getMonth() + 1);
      const totalDaysInMonth = new Date(yearNum, monthNum, 0).getDate() || 30;

      let monthExpense = 0;
      const hasCachedMonth = (monthlyExpensesMap && monthlyExpensesMap[currentUser] && monthlyExpensesMap[currentUser][targetMonth] !== undefined);
      if (!isMonthHistoryLoaded && !isFullHistoryLoaded && hasCachedMonth) {
        // 一打開只載入 15 筆時，直接取用雲端快取預先算好的當月總花費（0 秒秒開）
        monthExpense = Math.round(Number(monthlyExpensesMap[currentUser][targetMonth]) || 0);
      } else {
        allRecords.forEach(r => {
          if (r.user !== currentUser) return;
          if (r.Category === "收入") return;
          const recMonth = String(r["Recorded At"] || "").slice(0, 7);
          if (recMonth === targetMonth) {
            monthExpense += (Number(r.Amount) || 0);
          }
        });
        monthExpense = Math.round(monthExpense);
      }

      // 計算當月平均日花費：若是當月則除以今天幾號；若是過去月份則除以該月總天數
      let elapsedDays = 1;
      const todayDay = Math.max(1, parseInt(todayStr.slice(8, 10), 10) || new Date().getDate());
      if (targetMonth === currentRealMonth) {
        elapsedDays = todayDay;
      } else {
        elapsedDays = totalDaysInMonth;
      }
      const dailyAvg = Math.round(monthExpense / elapsedDays);

      const userCfg = userSettingsMap[currentUser] || {};
      const budget = Number(userCfg.monthlyBudget) || 0;

      const titleEl = document.getElementById("budget-bar-title");
      const statusEl = document.getElementById("budget-bar-status");
      const fillEl = document.getElementById("budget-bar-fill");
      const barTextEl = document.getElementById("budget-bar-text");
      if (!titleEl || !statusEl || !fillEl || !barTextEl) return;

      titleEl.innerHTML = `${monthNum}月預算 <span style="font-weight:600;color:var(--text-muted);font-size:0.73rem;margin-left:4px;">(日均花費 $${dailyAvg.toLocaleString()})</span>`;
      statusEl.style.color = "var(--muted)";

      if (budget <= 0) {
        statusEl.innerText = "未設上限";
        barTextEl.innerText = "點此設定預算";
        fillEl.style.width = "0%";
        fillEl.style.background = "var(--accent)";
        return;
      }

      // 計算今天實際花費（精準加總今日所有記帳支出）
      let todayExpense = 0;
      allRecords.forEach(r => {
        if (r.user !== currentUser) return;
        if (r.Category === "收入") return;
        const recDay = String(r["Recorded At"] || "").slice(0, 10);
        if (recDay === todayStr) {
          todayExpense += (Number(r.Amount) || 0);
        }
      });
      todayExpense = Math.round(todayExpense);

      // 有設定預算時：左右分置（左邊：11月預算 (日均花費 $XXX)，右邊：今日還剩 $XXX 可花 / 今日超支 $XXX）
      const remainBudget = budget - monthExpense;
      if (targetMonth === currentRealMonth) {
        // 截至今天以前（昨天以前）的當月累積支出
        const pastExpense = Math.max(0, monthExpense - todayExpense);
        // 今天開始時的剩餘可用預算額度
        const remainBudgetStartOfDay = budget - pastExpense;
        // 本月剩餘天數（包含今天）
        const remainingDays = Math.max(1, totalDaysInMonth - todayDay + 1);
        // 今天這一整天分配到的預算額度（若本月已被透支則為 0）
        const todayAllocated = remainBudgetStartOfDay > 0 ? Math.floor(remainBudgetStartOfDay / remainingDays) : 0;
        // 今天扣除已花費後「真正還剩」多少可花
        const todayRemaining = todayAllocated - todayExpense;

        if (remainBudget < 0) {
          statusEl.innerHTML = `<span style="color:#ef4444;font-weight:800;">當月已超支 $${Math.abs(remainBudget).toLocaleString()}</span>`;
        } else if (todayRemaining > 0) {
          statusEl.innerHTML = `<span style="color:var(--text);font-weight:800;">今日還剩 $${todayRemaining.toLocaleString()} 可花</span>`;
        } else if (todayRemaining === 0) {
          statusEl.innerHTML = `<span style="color:var(--text-muted);font-weight:800;">今日額度已用完 ($0)</span>`;
        } else {
          const overToday = Math.abs(todayRemaining);
          statusEl.innerHTML = `<span style="color:#ef4444;font-weight:800;">今日超支 $${overToday.toLocaleString()}</span>`;
        }
      } else {
        if (remainBudget >= 0) {
          statusEl.innerHTML = `<span style="color:var(--text);font-weight:800;">結餘 $${remainBudget.toLocaleString()}</span>`;
        } else {
          statusEl.innerHTML = `<span style="color:#ef4444;font-weight:800;">超支 $${Math.abs(remainBudget).toLocaleString()}</span>`;
        }
      }

      const pctRaw = (monthExpense / budget) * 100;
      const pctDisplay = Math.round(pctRaw);
      const barWidth = Math.min(100, Math.max(0, pctRaw)).toFixed(1);

      barTextEl.innerText = `$${monthExpense.toLocaleString()} / $${budget.toLocaleString()} (${pctDisplay}%)`;
      fillEl.style.width = `${barWidth}%`;

      if (pctRaw >= 100) {
        fillEl.style.background = "#ef4444";
      } else if (pctRaw >= 80) {
        fillEl.style.background = "#f59e0b";
      } else {
        fillEl.style.background = "var(--accent)";
      }
    }

    // 渲染分類佔比條與圖例色塊（點選任一分類可篩選下方消費細項）
    function renderChartSection(catSums, totalExpense) {
      const barBox = document.getElementById("chart-bar");
      const chipsBox = document.getElementById("cat-chips");
      const chartSec = document.getElementById("chart-section");

      if (totalExpense <= 0) {
        chartSec.style.display = "none";
        return;
      }
      chartSec.style.display = "flex";

      // 若目前選取的篩選類別在此期間完全沒有紀錄，自動解除篩選避免空畫面困惑
      if (selectedCategoryFilter && !catSums[selectedCategoryFilter]) {
        selectedCategoryFilter = "";
      }

      const sortedCats = Object.keys(catSums).sort((a, b) => catSums[b] - catSums[a]);

      let barHtml = "";
      let chipsHtml = "";

      sortedCats.forEach(cat => {
        const amt = catSums[cat];
        const pct = ((amt / totalExpense) * 100).toFixed(1);
        const meta = CATEGORY_META[cat] || { icon: "📦", color: "#64748b" };
        const isSelected = (selectedCategoryFilter === cat);
        const isDimmed = (selectedCategoryFilter !== "" && !isSelected);
        const segOpacity = isDimmed ? "0.32" : "1";
        const chipClass = "cat-chip" + (isSelected ? " active-filter" : (isDimmed ? " dimmed" : ""));
        const chipStyle = isSelected
          ? `border-color:${meta.color}; background:${meta.color}26;`
          : "";

        barHtml += `<div class="bar-seg" style="width:${pct}%; background:${meta.color}; opacity:${segOpacity}; cursor:pointer;" onclick="toggleCategoryFilter('${cat}')" title="點此只看「${cat}」(${pct}%)"></div>`;
        chipsHtml += `
          <div class="${chipClass}" style="${chipStyle}" onclick="toggleCategoryFilter('${cat}')" title="點一下只顯示「${cat}」細項（再點一下顯示全部）">
            <span class="chip-dot" style="background:${meta.color};"></span>
            <span class="chip-name">${cat}</span>
            <span class="chip-val">${pct}% ($${Math.round(amt).toLocaleString()})</span>
          </div>
        `;
      });

      barBox.innerHTML = barHtml;
      chipsBox.innerHTML = chipsHtml;
    }

    // 點擊百分比分類標籤：切換篩選該類別（再點一次恢復顯示全部）
    function toggleCategoryFilter(cat) {
      if (selectedCategoryFilter === cat) {
        selectedCategoryFilter = "";
      } else {
        selectedCategoryFilter = cat;
      }
      listRenderLimit = 150;
      refreshView();
    }

    function clearCategoryFilter() {
      if (!selectedCategoryFilter) return;
      selectedCategoryFilter = "";
      listRenderLimit = 150;
      refreshView();
    }

    // 三條線排序選單開關與選擇處理
    function toggleSortMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById("sort-dropdown-menu");
      const btn = document.getElementById("btn-sort-lines");
      if (!menu || !btn) return;
      const isOpen = menu.classList.contains("open");
      if (isOpen) {
        menu.classList.remove("open");
        btn.classList.remove("open");
      } else {
        menu.classList.add("open");
        btn.classList.add("open");
      }
    }

    function selectSortOption(orderVal) {
      currentSortOrder = orderVal || "time_desc";
      const allOpts = ["time_desc", "time_asc", "amount_desc", "amount_asc"];
      allOpts.forEach(opt => {
        const el = document.getElementById("sort-opt-" + opt);
        if (!el) return;
        const chk = el.querySelector(".sort-check");
        if (opt === currentSortOrder) {
          el.classList.add("active");
          if (chk) chk.innerText = "✓";
        } else {
          el.classList.remove("active");
          if (chk) chk.innerText = "";
        }
      });
      const menu = document.getElementById("sort-dropdown-menu");
      const btn = document.getElementById("btn-sort-lines");
      if (menu) menu.classList.remove("open");
      if (btn) btn.classList.remove("open");
      listRenderLimit = 150;
      refreshView();
    }

    function onSortOrderChange(orderVal) {
      selectSortOption(orderVal);
    }

    document.addEventListener("click", function(e) {
      const wrap = document.getElementById("sort-menu-wrap");
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById("sort-dropdown-menu");
        const btn = document.getElementById("btn-sort-lines");
        if (menu) menu.classList.remove("open");
        if (btn) btn.classList.remove("open");
      }
    });

    function sortRecordsArray(list) {
      const arr = list.slice();
      arr.sort((a, b) => {
        if (currentSortOrder === "amount_desc") {
          const diff = (Number(b.Amount) || 0) - (Number(a.Amount) || 0);
          if (diff !== 0) return diff;
          return String(b["Recorded At"] || "").localeCompare(String(a["Recorded At"] || ""));
        } else if (currentSortOrder === "amount_asc") {
          const diff = (Number(a.Amount) || 0) - (Number(b.Amount) || 0);
          if (diff !== 0) return diff;
          return String(b["Recorded At"] || "").localeCompare(String(a["Recorded At"] || ""));
        } else if (currentSortOrder === "time_asc") {
          const cmp = String(a["Recorded At"] || "").localeCompare(String(b["Recorded At"] || ""));
          if (cmp !== 0) return cmp;
          return (b.rowIndex || 0) - (a.rowIndex || 0);
        } else {
          // 預設 time_desc：時間由近到遠
          const cmp = String(b["Recorded At"] || "").localeCompare(String(a["Recorded At"] || ""));
          if (cmp !== 0) return cmp;
          return (a.rowIndex || 0) - (b.rowIndex || 0);
        }
      });
      return arr;
    }

    function expandListRenderLimit(step) {
      listRenderLimit = step === "ALL" ? 999999 : (listRenderLimit + (step || 200));
      refreshView();
    }

    // 🔍 搜尋輸入處理與雙群集聚合 (完全相符「晚餐」 vs 類似項目「晚餐...」)
    function onSearchInput(val) {
      const q = String(val || "").trim();
      const changed = (q !== searchQuery);
      searchQuery = q;
      const clearBtn = document.getElementById("search-clear-btn");
      if (clearBtn) {
        clearBtn.style.display = q.length > 0 ? "flex" : "none";
      }

      // 若開始搜尋且尚未載入完整歷史紀錄，自動背景載入全部歷史資料以便統計上千筆紀錄
      if (q.length > 0 && !isFullHistoryLoaded && !isLoadingFullHistory) {
        loadFullHistoryFromServer();
      }
      if (changed || q.length > 0) {
        refreshView();
      }
    }

    function clearSearchInput() {
      const inp = document.getElementById("search-input");
      if (inp) inp.value = "";
      searchQuery = "";
      expandedClusters = { exact: false, similar: false };
      showAllClusterLimit = { exact: 100, similar: 100 };
      const clearBtn = document.getElementById("search-clear-btn");
      if (clearBtn) clearBtn.style.display = "none";
      refreshView();
    }

    function toggleSearchCluster(clusterKey) {
      expandedClusters[clusterKey] = !expandedClusters[clusterKey];
      refreshView();
    }

    function expandClusterLimit(clusterKey, event) {
      if (event) event.stopPropagation();
      showAllClusterLimit[clusterKey] = (showAllClusterLimit[clusterKey] || 100) + 300;
      refreshView();
    }

    function renderSingleRecordCardHtml(r, poolIdx, forceShowDate) {
      const meta = CATEGORY_META[r.Category] || { icon: "📦", color: "#64748b" };
      const isInc = r.Category === "收入";
      const amtStr = (isInc ? "+" : "") + "$" + Number(r.Amount).toLocaleString();
      const amtClass = isInc ? "rec-amount-clean income" : "rec-amount-clean";

      // 當調成「月」或「年」（或跨日搜尋）時，在品項旁顯示日期（天模式不顯示）
      let dateBadgeHtml = "";
      if (currentDimension === "month" || currentDimension === "year" || forceShowDate) {
        const fullDate = String(r["Recorded At"] || "").split(" ")[0]; // YYYY/MM/DD
        const shortDate = ((currentDimension === "year" && currentTimeKey === "ALL") || forceShowDate)
          ? fullDate
          : (fullDate.length >= 10 ? fullDate.slice(5) : fullDate); // MM/DD
        if (shortDate) {
          dateBadgeHtml = `<span class="rec-date-tag">${escapeHtml(shortDate)}</span>`;
        }
      }

      const debtBtnHtml = !isInc
        ? `<button type="button" class="act-icon-xs" title="欠錢" onclick="event.stopPropagation(); openDebtSplitModal(${poolIdx})">
             <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1"></path><line x1="12" y1="6" x2="12" y2="18"></line></svg>
           </button>`
        : "";

      return `
        <div class="record-row-wrap">
          <div class="record-slim-row" onclick="openEditModal(${poolIdx})">
            <div class="rec-slim-left">
              <div class="cat-icon-sm" style="background:${meta.color};"
                   onclick="openCategorySheet(event, ${poolIdx})" title="點一下直接換分類">
                ${meta.icon}
              </div>
              <span class="rec-note-text">${escapeHtml(r.note || r.Category)}</span>
              ${dateBadgeHtml}
            </div>
            <div class="rec-slim-right">
              <div class="rec-inline-actions" onclick="event.stopPropagation()">
                ${debtBtnHtml}
                <button type="button" class="act-icon-xs" title="編輯" onclick="event.stopPropagation(); openEditModal(${poolIdx})">
                  <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
                <button type="button" class="act-icon-xs del" title="刪除" onclick="event.stopPropagation(); quickDeleteRecord(${poolIdx})">
                  <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                </button>
              </div>
              <div class="${amtClass}">${amtStr}</div>
            </div>
          </div>
        </div>
      `;
    }

    // 渲染細項列表（支援分類點選篩選、4 種排序方式、以及搜尋雙群集模式）
    function renderRecordsList(records) {
      const container = document.getElementById("records-container");
      const badgeEl = document.getElementById("active-cat-filter-badge");

      if (searchQuery.length > 0) {
        if (badgeEl) badgeEl.style.display = "none";
        renderSearchClusterView(container, searchQuery);
        return;
      }

      // 1. 若有點選上方某個分類百分比（例如「食物」或「消費」），只篩選該分類的紀錄
      let displayList = records;
      if (selectedCategoryFilter) {
        displayList = records.filter(r => (r.Category || "其他") === selectedCategoryFilter);
        const meta = CATEGORY_META[selectedCategoryFilter] || { icon: "📦", color: "#64748b" };
        if (badgeEl) {
          badgeEl.style.display = "inline-flex";
          badgeEl.style.borderColor = meta.color;
          badgeEl.style.background = `${meta.color}24`;
          badgeEl.innerHTML = `<span>${escapeHtml(selectedCategoryFilter)} ✕</span>`;
        }
      } else if (badgeEl) {
        badgeEl.style.display = "none";
      }

      // 2. 依當前選擇的排序方式排序（時間近到遠 / 遠到近 / 金額高到低 / 低到高）
      const sortedList = sortRecordsArray(displayList);

      if (sortedList.length === 0) {
        renderedRecordsPool = [];
        container.innerHTML = `<div class="empty-msg">這段時間沒有記帳紀錄喔～ 🍃</div>`;
        return;
      }

      // 3. 若在「年」或「月」模式下筆數較多，先渲染前 listRenderLimit 筆以保持極速流暢，並提供展開按鈕
      const visibleList = sortedList.slice(0, listRenderLimit);
      renderedRecordsPool = visibleList.slice();

      let cardsHtml = visibleList.map((r, idx) => renderSingleRecordCardHtml(r, idx, false)).join("");

      if (sortedList.length > listRenderLimit) {
        const remain = sortedList.length - listRenderLimit;
        cardsHtml += `
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button type="button" class="rec-btn-mini" style="flex:1; padding:10px; justify-content:center;" onclick="expandListRenderLimit(200)">
              👇 再顯示 200 筆（還有 ${remain.toLocaleString()} 筆）
            </button>
            <button type="button" class="rec-btn-mini" style="padding:10px 14px; justify-content:center;" onclick="expandListRenderLimit('ALL')">
              ⚡ 展開全部 (${sortedList.length.toLocaleString()}筆)
            </button>
          </div>
        `;
      }

      container.innerHTML = cardsHtml;
    }

    function renderSearchClusterView(container, query) {
      const qTrim = query.trim();
      const qUpper = qTrim.toUpperCase();

      // 搜尋當前使用者的全部歷史紀錄
      const userAll = allRecords.filter(r => r.user === currentUser);
      let exactList = [];
      let similarList = [];

      userAll.forEach(r => {
        const noteText = String(r.note || r.Category || "").trim();
        const noteUpper = noteText.toUpperCase();
        if (noteUpper === qUpper) {
          exactList.push(r);
        } else if (noteUpper.indexOf(qUpper) !== -1) {
          similarList.push(r);
        }
      });

      // 套用目前的排序方式（時間近到遠 / 遠到近 / 金額高到低 / 低到高）
      exactList = sortRecordsArray(exactList);
      similarList = sortRecordsArray(similarList);

      const totalCount = exactList.length + similarList.length;
      const exactSum = exactList.reduce((acc, r) => acc + (Number(r.Amount) || 0), 0);
      const similarSum = similarList.reduce((acc, r) => acc + (Number(r.Amount) || 0), 0);
      const grandTotal = exactSum + similarSum;

      renderedRecordsPool = [];
      let html = `
        <div class="search-summary-bar">
          <div>
            🔍 搜尋「<strong>${escapeHtml(qTrim)}</strong>」共 <strong>${totalCount.toLocaleString()}</strong> 項
            ${!isFullHistoryLoaded ? `<span style="color:#f59e0b; font-size:0.74rem; margin-left:4px;">(⏳ 正在載入全部歷史紀錄...)</span>` : ""}
          </div>
          <div>總計 <strong>$${Math.round(grandTotal).toLocaleString()}</strong></div>
        </div>
      `;

      if (totalCount === 0) {
        html += `<div class="empty-msg">${!isFullHistoryLoaded ? "⏳ 正在翻找全部歷史資料中..." : `找不到包含「${escapeHtml(qTrim)}」的記帳紀錄喔～ 🔍`}</div>`;
        container.innerHTML = html;
        return;
      }

      // 群集 1：一模一樣的字 (例如「晚餐」)
      if (exactList.length > 0) {
        const isExp = !!expandedClusters.exact;
        const limit = showAllClusterLimit.exact || 100;
        const sliceList = isExp ? exactList.slice(0, limit) : [];
        const cardsHtml = sliceList.map(r => {
          const poolIdx = renderedRecordsPool.length;
          renderedRecordsPool.push(r);
          return renderSingleRecordCardHtml(r, poolIdx, true);
        }).join("");

        const moreBtnHtml = (isExp && exactList.length > limit)
          ? `<button type="button" class="rec-btn-mini" style="width:100%; padding:10px; margin-top:4px; text-align:center;" onclick="expandClusterLimit('exact', event)">👇 顯示更多（還有 ${(exactList.length - limit).toLocaleString()} 項）</button>`
          : "";

        html += `
          <div class="cluster-card">
            <div class="cluster-header" onclick="toggleSearchCluster('exact')">
              <div class="cluster-left">
                <div class="cluster-title">
                  <span>${escapeHtml(qTrim)}</span>
                </div>
              </div>
              <div class="cluster-right">
                <div>
                  <div class="cluster-total">$${Math.round(exactSum).toLocaleString()}</div>
                  <div class="cluster-count">${exactList.length.toLocaleString()} 項</div>
                </div>
                <div class="cluster-arrow ${isExp ? "open" : ""}">▼</div>
              </div>
            </div>
            <div class="cluster-body ${isExp ? "open" : ""}">
              ${cardsHtml}
              ${moreBtnHtml}
            </div>
          </div>
        `;
      }

      // 群集 2：類似的字 (例如「晚餐...」)
      if (similarList.length > 0) {
        const isExp = !!expandedClusters.similar;
        const limit = showAllClusterLimit.similar || 100;

        const sliceList = isExp ? similarList.slice(0, limit) : [];
        const cardsHtml = sliceList.map(r => {
          const poolIdx = renderedRecordsPool.length;
          renderedRecordsPool.push(r);
          return renderSingleRecordCardHtml(r, poolIdx, true);
        }).join("");

        const moreBtnHtml = (isExp && similarList.length > limit)
          ? `<button type="button" class="rec-btn-mini" style="width:100%; padding:10px; margin-top:4px; text-align:center;" onclick="expandClusterLimit('similar', event)">👇 顯示更多（還有 ${(similarList.length - limit).toLocaleString()} 項）</button>`
          : "";

        html += `
          <div class="cluster-card">
            <div class="cluster-header" onclick="toggleSearchCluster('similar')">
              <div class="cluster-left">
                <div class="cluster-title">
                  <span>${escapeHtml(qTrim)}...</span>
                </div>
              </div>
              <div class="cluster-right">
                <div>
                  <div class="cluster-total">$${Math.round(similarSum).toLocaleString()}</div>
                  <div class="cluster-count">${similarList.length.toLocaleString()} 項</div>
                </div>
                <div class="cluster-arrow ${isExp ? "open" : ""}">▼</div>
              </div>
            </div>
            <div class="cluster-body ${isExp ? "open" : ""}">
              ${cardsHtml}
              ${moreBtnHtml}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // 更新時間導航標籤
    function updateTimeDropdownAndNav() {
      const label = document.getElementById("nav-label");
      const todayStr = getTodayString();
      let displayLabel = currentTimeKey;
      if (currentDimension === "day" && currentTimeKey === todayStr) {
        displayLabel += " (今天)";
      } else if (currentDimension === "year" && currentTimeKey === "ALL") {
        displayLabel = "全部年份 (ALL)";
      }
      if (label) label.innerText = displayLabel;

      const calOverlay = document.getElementById("calendar-picker-overlay");
      if (calOverlay && calOverlay.classList.contains("open")) {
        renderCalendarPicker();
      }
    }

    // =====================================================
    // 📅 彈出式行事曆月曆選擇器 (支援 天月曆 / 月份宮格 / 年份宮格)
    // =====================================================
    let calViewYear = new Date().getFullYear();
    let calViewMonth = new Date().getMonth() + 1; // 1 ~ 12
    let calSubMode = "day"; // 'day' | 'month' | 'year'

    function openCalendarPicker(e) {
      if (e) e.stopPropagation();
      const now = new Date();
      const parts = String(currentTimeKey || "").split("/").map(Number);

      if (currentDimension === "day") {
        calViewYear = parts[0] || now.getFullYear();
        calViewMonth = parts[1] || (now.getMonth() + 1);
        calSubMode = "day";
        if (!isMonthHistoryLoaded) {
          loadMonthHistoryFromServer();
        }
      } else if (currentDimension === "month") {
        calViewYear = parts[0] || now.getFullYear();
        calViewMonth = parts[1] || (now.getMonth() + 1);
        calSubMode = "month";
        if (!isMonthHistoryLoaded) {
          loadMonthHistoryFromServer();
        }
      } else {
        calViewYear = (currentTimeKey !== "ALL" && parts[0]) ? parts[0] : now.getFullYear();
        calSubMode = "year";
        if (!isFullHistoryLoaded) {
          loadFullHistoryFromServer();
        }
      }

      const todayBtn = document.getElementById("cal-today-btn");
      if (todayBtn) {
        todayBtn.innerText = currentDimension === "day" ? "回到今天" : (currentDimension === "month" ? "回到本月" : "回到今年");
      }

      renderCalendarPicker();
      document.getElementById("calendar-picker-overlay").classList.add("open");
    }

    function closeCalendarPicker(e) {
      document.getElementById("calendar-picker-overlay").classList.remove("open");
    }

    function toggleCalHeaderView() {
      if (calSubMode === "day") {
        calSubMode = "month";
      } else if (calSubMode === "month") {
        calSubMode = "year";
      } else if (currentDimension === "day") {
        calSubMode = "day";
      } else if (currentDimension === "month") {
        calSubMode = "month";
      }
      renderCalendarPicker();
    }

    function calStepHeader(dir) {
      if (calSubMode === "day") {
        calViewMonth += dir;
        if (calViewMonth > 12) {
          calViewMonth = 1;
          calViewYear++;
        } else if (calViewMonth < 1) {
          calViewMonth = 12;
          calViewYear--;
        }
        // 若往前翻到更早月份，自動補載入歷史紀錄以利顯示消費圓點
        if (dir < 0 && !isFullHistoryLoaded) {
          loadFullHistoryFromServer();
        }
      } else if (calSubMode === "month") {
        calViewYear += dir;
        if (dir < 0 && !isFullHistoryLoaded) {
          loadFullHistoryFromServer();
        }
      } else if (calSubMode === "year") {
        calViewYear += dir * 6;
      }
      renderCalendarPicker();
    }

    function renderCalendarPicker() {
      const titleEl = document.getElementById("cal-header-title");
      const bodyEl = document.getElementById("cal-body-container");
      if (!titleEl || !bodyEl) return;

      // 收集目前使用者有紀錄的日期、月份、年份集合（用來在月曆上點亮小圓點）
      const activeDaySet = new Set();
      const activeMonthSet = new Set();
      const activeYearSet = new Set();
      allRecords.forEach(r => {
        if (r.user !== currentUser) return;
        const dStr = String(r["Recorded At"] || "");
        if (dStr.length >= 10) activeDaySet.add(dStr.slice(0, 10));
        if (dStr.length >= 7) activeMonthSet.add(dStr.slice(0, 7));
        if (dStr.length >= 4) activeYearSet.add(dStr.slice(0, 4));
      });

      const todayStr = getTodayString();

      if (calSubMode === "day") {
        const ymPrefix = `${calViewYear}/${String(calViewMonth).padStart(2, "0")}`;
        titleEl.innerHTML = `<span>${calViewYear}年 ${calViewMonth}月</span><span style="font-size:0.7rem; color:var(--text-muted);">▼</span>`;

        const firstDayWeek = new Date(calViewYear, calViewMonth - 1, 1).getDay(); // 0(日) ~ 6(六)
        const daysInMonth = new Date(calViewYear, calViewMonth, 0).getDate();
        const prevMonthDays = new Date(calViewYear, calViewMonth - 1, 0).getDate();

        const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
        let html = `<div class="cal-weekdays">${weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join("")}</div>`;
        html += `<div class="cal-days-grid">`;

        // 上個月底補齊格
        for (let i = firstDayWeek - 1; i >= 0; i--) {
          const dNum = prevMonthDays - i;
          let py = calViewYear;
          let pm = calViewMonth - 1;
          if (pm < 1) { pm = 12; py--; }
          const fullKey = `${py}/${String(pm).padStart(2, "0")}/${String(dNum).padStart(2, "0")}`;
          const hasDot = activeDaySet.has(fullKey);
          html += `
            <button type="button" class="cal-day-cell other-month" onclick="selectCalendarDate('${fullKey}')">
              <span>${dNum}</span>
              ${hasDot ? `<span class="cal-has-rec-dot"></span>` : ""}
            </button>
          `;
        }

        // 本月 1 ~ daysInMonth
        for (let d = 1; d <= daysInMonth; d++) {
          const fullKey = `${ymPrefix}/${String(d).padStart(2, "0")}`;
          const isSelected = (currentDimension === "day" && currentTimeKey === fullKey);
          const isToday = (fullKey === todayStr);
          const hasDot = activeDaySet.has(fullKey);
          const cls = "cal-day-cell" + (isSelected ? " selected" : "") + (isToday ? " is-today" : "");
          html += `
            <button type="button" class="${cls}" onclick="selectCalendarDate('${fullKey}')">
              <span>${d}</span>
              ${hasDot ? `<span class="cal-has-rec-dot"></span>` : ""}
            </button>
          `;
        }

        // 下個月初補齊格（補滿 7 的倍數）
        const totalCells = firstDayWeek + daysInMonth;
        const remainCells = (7 - (totalCells % 7)) % 7;
        for (let n = 1; n <= remainCells; n++) {
          let ny = calViewYear;
          let nm = calViewMonth + 1;
          if (nm > 12) { nm = 1; ny++; }
          const fullKey = `${ny}/${String(nm).padStart(2, "0")}/${String(n).padStart(2, "0")}`;
          const hasDot = activeDaySet.has(fullKey);
          html += `
            <button type="button" class="cal-day-cell other-month" onclick="selectCalendarDate('${fullKey}')">
              <span>${n}</span>
              ${hasDot ? `<span class="cal-has-rec-dot"></span>` : ""}
            </button>
          `;
        }

        html += `</div>`;
        bodyEl.innerHTML = html;
      } else if (calSubMode === "month") {
        titleEl.innerHTML = `<span>${calViewYear}年</span><span style="font-size:0.7rem; color:var(--text-muted);">▼</span>`;
        let html = `<div class="cal-months-grid">`;
        for (let m = 1; m <= 12; m++) {
          const ymKey = `${calViewYear}/${String(m).padStart(2, "0")}`;
          const isSel = (currentDimension === "month" && currentTimeKey === ymKey) ||
                        (currentDimension === "day" && calViewMonth === m && String(currentTimeKey).startsWith(ymKey));
          const hasDot = activeMonthSet.has(ymKey);
          html += `
            <button type="button" class="cal-month-cell ${isSel ? "selected" : ""}" onclick="selectCalendarMonth(${calViewYear}, ${m})">
              <span>${m}月</span>
              ${hasDot ? `<span class="cal-has-rec-dot" style="${isSel ? "background:#fff;" : ""}"></span>` : ""}
            </button>
          `;
        }
        html += `</div>`;
        bodyEl.innerHTML = html;
      } else {
        titleEl.innerHTML = `<span>選擇年份</span>`;
        const curY = new Date().getFullYear();
        const yearSet = new Set([curY, calViewYear, calViewYear - 1, calViewYear - 2, calViewYear - 3, calViewYear + 1]);
        activeYearSet.forEach(y => { if (Number(y)) yearSet.add(Number(y)); });
        const sortedYears = Array.from(yearSet).sort((a, b) => b - a);

        let html = `<div class="cal-months-grid">`;
        sortedYears.forEach(y => {
          const yKey = String(y);
          const isSel = (currentDimension === "year" && currentTimeKey === yKey) ||
                        (currentDimension !== "year" && calViewYear === y);
          const hasDot = activeYearSet.has(yKey);
          html += `
            <button type="button" class="cal-month-cell ${isSel ? "selected" : ""}" onclick="selectCalendarYear('${yKey}')">
              <span>${y}年</span>
              ${hasDot ? `<span class="cal-has-rec-dot" style="${isSel ? "background:#fff;" : ""}"></span>` : ""}
            </button>
          `;
        });
        html += `</div>`;
        if (currentDimension === "year") {
          const isAllSel = (currentTimeKey === "ALL");
          html += `
            <button type="button" class="cal-month-cell ${isAllSel ? "selected" : ""}" style="width:100%; margin-top:8px; height:40px;" onclick="selectCalendarYear('ALL')">
              <span>ALL（顯示全部年份紀錄）</span>
            </button>
          `;
        }
        bodyEl.innerHTML = html;
      }
    }

    // 實際更新時間與重繪畫面
    function applyNavigateStep(direction) {
      const parts = currentTimeKey.split("/").map(Number);
      if (currentDimension === "day") {
        const d = new Date(parts[0], parts[1] - 1, parts[2] + direction);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        currentTimeKey = `${y}/${m}/${day}`;
      } else if (currentDimension === "month") {
        let y = parts[0];
        let m = parts[1] + direction;
        if (m > 12) { m = 1; y++; }
        if (m < 1) { m = 12; y--; }
        currentTimeKey = `${y}/${String(m).padStart(2, "0")}`;
      } else if (currentDimension === "year") {
        if (currentTimeKey === "ALL") {
          currentTimeKey = String(new Date().getFullYear());
        } else {
          currentTimeKey = String(parts[0] + direction);
        }
      }

      // 若往前翻閱較早日期，依三段式策略（15筆 -> 200筆 -> 全部）自動載入更多紀錄
      if (direction < 0 && !isFullHistoryLoaded && allRecords.length > 0) {
        const oldestLoaded = String(allRecords[allRecords.length - 1]["Recorded At"] || "").slice(0, 10);
        if (oldestLoaded && currentTimeKey <= oldestLoaded) {
          if (!isMonthHistoryLoaded) {
            loadMonthHistoryFromServer();
          } else {
            loadFullHistoryFromServer();
          }
        }
      }
      refreshView();
    }

    let isAnimatingSwipe = false;

    // 導航切換：上一期 (-1) 或 下一期 (+1)，附帶流暢水平滑頁動畫
    function navigateStep(direction) {
      const stage = document.getElementById("swipe-stage");
      if (!stage || isAnimatingSwipe) {
        applyNavigateStep(direction);
        return;
      }
      isAnimatingSwipe = true;
      // direction === 1 (下一天)：畫面往左滑出 (-64px)，新畫面從右側 (+64px) 滑入
      // direction === -1 (上一天)：畫面往右滑出 (+64px)，新畫面從左側 (-64px) 滑入
      const outX = direction > 0 ? -64 : 64;
      const inX = direction > 0 ? 64 : -64;

      stage.style.transition = "transform 0.14s cubic-bezier(0.4, 0, 1, 1), opacity 0.14s ease";
      stage.style.transform = `translate3d(${outX}px, 0, 0)`;
      stage.style.opacity = "0.18";

      setTimeout(function() {
        applyNavigateStep(direction);
        stage.style.transition = "none";
        stage.style.transform = `translate3d(${inX}px, 0, 0)`;
        stage.style.opacity = "0.18";
        void stage.offsetWidth; // 強制瀏覽器重繪以觸發下一段滑入動畫

        stage.style.transition = "transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease";
        stage.style.transform = "translate3d(0, 0, 0)";
        stage.style.opacity = "1";

        setTimeout(function() {
          stage.style.transition = "";
          stage.style.transform = "";
          stage.style.opacity = "";
          isAnimatingSwipe = false;
        }, 250);
      }, 135);
    }

    // 📱 手勢向左/向右跟手拖曳與動態滑頁切換
    function bindSwipeGestures() {
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      let isDraggingHorizontal = false;
      let directionLocked = false;

      function isAnyOverlayOpen() {
        return (
          document.getElementById("calendar-picker-overlay").classList.contains("open") ||
          document.getElementById("report-modal-overlay").classList.contains("open") ||
          document.getElementById("category-sheet-overlay").classList.contains("open") ||
          document.getElementById("edit-modal").classList.contains("open") ||
          document.getElementById("split-debt-modal").classList.contains("open") ||
          document.getElementById("settings-modal").classList.contains("open") ||
          document.getElementById("audit-modal").classList.contains("open")
        );
      }

      document.addEventListener("touchstart", function(e) {
        if (!e.touches || e.touches.length !== 1 || isAnimatingSwipe || isAnyOverlayOpen()) return;
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
        if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
        isDraggingHorizontal = false;
        directionLocked = false;
      }, { passive: true });

      document.addEventListener("touchmove", function(e) {
        if (!e.touches || e.touches.length !== 1 || isAnimatingSwipe || !touchStartTime) return;
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;

        if (!directionLocked) {
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
          directionLocked = true;
          isDraggingHorizontal = Math.abs(dx) > Math.abs(dy) * 1.15;
        }

        if (!isDraggingHorizontal) return;
        const stage = document.getElementById("swipe-stage");
        if (!stage) return;

        // 讓畫面即時跟著手指水平滑動（帶柔順阻尼感）
        const dampedX = Math.max(-130, Math.min(130, dx * 0.52));
        const fade = Math.max(0.45, 1 - Math.abs(dampedX) / 240);
        stage.style.transition = "none";
        stage.style.transform = `translate3d(${dampedX}px, 0, 0)`;
        stage.style.opacity = String(fade);
      }, { passive: true });

      document.addEventListener("touchend", function(e) {
        if (!touchStartTime) return;
        const stage = document.getElementById("swipe-stage");
        const endTouch = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
        const deltaX = endTouch ? (endTouch.clientX - touchStartX) : 0;
        const deltaY = endTouch ? (endTouch.clientY - touchStartY) : 0;
        const elapsed = Date.now() - touchStartTime;
        const wasHorizontal = isDraggingHorizontal;
        touchStartTime = 0;
        isDraggingHorizontal = false;
        directionLocked = false;

        if (isAnyOverlayOpen()) {
          if (stage) {
            stage.style.transition = "";
            stage.style.transform = "";
            stage.style.opacity = "";
          }
          return;
        }

        const triggered = wasHorizontal && (
          Math.abs(deltaX) > 52 ||
          (elapsed < 450 && Math.abs(deltaX) > 34 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2)
        );

        if (triggered) {
          const direction = deltaX < 0 ? 1 : -1;
          if (!stage) {
            applyNavigateStep(direction);
            return;
          }
          isAnimatingSwipe = true;
          const outX = direction > 0 ? -95 : 95;
          const inX = direction > 0 ? 75 : -75;

          stage.style.transition = "transform 0.13s cubic-bezier(0.4, 0, 1, 1), opacity 0.13s ease";
          stage.style.transform = `translate3d(${outX}px, 0, 0)`;
          stage.style.opacity = "0.12";

          setTimeout(function() {
            applyNavigateStep(direction);
            stage.style.transition = "none";
            stage.style.transform = `translate3d(${inX}px, 0, 0)`;
            stage.style.opacity = "0.15";
            void stage.offsetWidth;

            stage.style.transition = "transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease";
            stage.style.transform = "translate3d(0, 0, 0)";
            stage.style.opacity = "1";

            setTimeout(function() {
              stage.style.transition = "";
              stage.style.transform = "";
              stage.style.opacity = "";
              isAnimatingSwipe = false;
            }, 250);
          }, 125);
        } else if (stage && wasHorizontal) {
          // 未達切換門檻時，平滑彈回原位
          stage.style.transition = "transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease";
          stage.style.transform = "translate3d(0, 0, 0)";
          stage.style.opacity = "1";
          setTimeout(function() {
            stage.style.transition = "";
            stage.style.transform = "";
            stage.style.opacity = "";
          }, 210);
        }
      }, { passive: true });
    }

              currentTimeKey = recordedAt.slice(0, 10);

            saveBtn.disabled = false;
            saveBtn.innerText = "儲存";
            alert("新增失敗：" + err.message);

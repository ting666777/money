    function openDebtSplitModal(poolIndex) {
      const rec = renderedRecordsPool[poolIndex] || getFilteredRecords()[poolIndex];
      if (!rec) return;
      currentDebtSplitRecord = rec;

      const payer = rec.user || currentUser;
      const totalAmt = Number(rec.Amount) || 0;
      const noteText = rec.note || rec.Category || "消費";

      // 依奇數定成+1規則計算一半金額
      const dingShare = Math.ceil(totalAmt / 2);
      const yuShare = Math.floor(totalAmt / 2);
      const debtorShare = (payer === "定成") ? yuShare : dingShare;

      document.getElementById("debt-modal-heading").innerText = `欠錢 (${payer})`;
      document.getElementById("debt-modal-input-label").innerText = `${noteText} ($${totalAmt}) — 拆帳金額`;

      const halfBtn = document.getElementById("debt-half-btn");
      if (halfBtn) {
        halfBtn.innerText = `一半 ($${debtorShare})`;
        halfBtn.title = `點擊自動填入一半：定成 $${dingShare}、妤珊 $${yuShare}（奇數定成+1）`;
      }

      const halfTip = document.getElementById("debt-modal-half-tip");
      if (halfTip) {
        halfTip.innerText = `（定成 $${dingShare}，妤珊 $${yuShare}）`;
      }

      const inp = document.getElementById("debt-split-amount");
      inp.max = totalAmt;
      inp.value = "";

      document.getElementById("split-debt-modal").classList.add("open");
      setTimeout(() => { inp.focus(); }, 80);
    }

    function fillHalfSplitAmount() {
      if (!currentDebtSplitRecord) return;
      const rec = currentDebtSplitRecord;
      const payer = rec.user || currentUser;
      const totalAmt = Number(rec.Amount) || 0;

      const dingShare = Math.ceil(totalAmt / 2);
      const yuShare = Math.floor(totalAmt / 2);
      const debtorShare = (payer === "定成") ? yuShare : dingShare;

      const inp = document.getElementById("debt-split-amount");
      inp.value = debtorShare;
      inp.focus();
    }

    function closeDebtSplitModal() {
      document.getElementById("split-debt-modal").classList.remove("open");
      currentDebtSplitRecord = null;
    }

    function handleDebtSplitSubmit(e) {
      e.preventDefault();
      if (!currentDebtSplitRecord) return;
      const rec = currentDebtSplitRecord;
      const splitAmt = Math.round(parseFloat(document.getElementById("debt-split-amount").value));
      const totalAmt = Number(rec.Amount) || 0;

      if (isNaN(splitAmt) || splitAmt <= 0 || splitAmt > totalAmt) {
        alert(`請輸入 1 ~ ${totalAmt} 之間的金額`);
        return;
      }

      const btn = document.getElementById("debt-save-btn");
      btn.disabled = true;
      btn.innerText = "儲存中...";
      startProgress();

      const criteria = {
        recordedAt: rec["Recorded At"],
        amount: rec.Amount,
        note: rec.note
      };

      google.script.run
        .withSuccessHandler(function() {
          btn.disabled = false;
          btn.innerText = "儲存";
          closeDebtSplitModal();
          triggerManualRefresh();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          btn.disabled = false;
          btn.innerText = "儲存";
          alert("失敗：" + err.message);
        })
        .splitRecordAndSyncDebt(rec.user, rec.rowIndex, splitAmt, criteria);
    }

    // 快捷刪除按鈕
    function quickDeleteRecord(recordIndex) {
      const rec = renderedRecordsPool[recordIndex] || getFilteredRecords()[recordIndex];
      if (!rec) return;
      if (!confirm(`確定要刪除【${rec.note || rec.Category}】$${rec.Amount} 的紀錄嗎？`)) return;

      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          triggerManualRefresh();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          alert("刪除失敗：" + err.message);
        })
        .deleteRecordByRow(rec.user, rec.rowIndex, {
          recordedAt: rec["Recorded At"],
          amount: rec.Amount,
          note: rec.note
        });
    }

    function getFilteredRecords() {
      return allRecords.filter(r => {
        if (r.user !== currentUser) return false;
        const recDate = String(r["Recorded At"] || "");
        if (currentDimension === "day") return recDate.slice(0, 10) === currentTimeKey;
        if (currentDimension === "month") return recDate.slice(0, 7) === currentTimeKey;
        if (currentDimension === "year") return currentTimeKey === "ALL" ? true : (recDate.slice(0, 4) === currentTimeKey);
        return false;
      });
    }

    function startProgress() {
      // 啟動全螢幕流動霓虹光暈外框轉圈圈
      const neon = document.getElementById("screen-neon-border");
      if (neon) neon.classList.add("active");
    }

    function finishProgress() {
      // 關閉全螢幕流動霓虹光暈外框
      const neon = document.getElementById("screen-neon-border");
      if (neon) neon.classList.remove("active");
    }

    function triggerManualRefresh() {
      const btn = document.getElementById("btn-refresh");
      btn.classList.add("spinning");
      startProgress();
      const queryUser = isLockedUser ? currentUser : "";
      // 三段式載入：搜尋或看「年」載入全部，看「月」或非今日的「天」載入 200 筆，看今日「天」只極速撈取最新 15 筆
      let fetchParams = { user: queryUser, limit: 15 };
      if (searchQuery.length > 0 || currentDimension === "year") {
        fetchParams = { user: queryUser, all: true };
      } else if (currentDimension === "month" || isMonthHistoryLoaded || currentTimeKey !== getTodayString()) {
        fetchParams = { user: queryUser, limit: 200 };
      }
      google.script.run
        .withSuccessHandler(function(data) {
          btn.classList.remove("spinning");
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.userSettings) {
            syncUserSettingsFromServer(data.userSettings);
          }
          if (data && data.allRecords) {
            allRecords = normalizeRecords(data.allRecords);
            isFullHistoryLoaded = !!data.isCompleteHistory;
            isMonthHistoryLoaded = isFullHistoryLoaded || (fetchParams.limit >= 200);
            refreshView();
          }
        })
        .withFailureHandler(function(err) {
          btn.classList.remove("spinning");
          finishProgress();
          alert("重新整理失敗：" + err.message);
        })
        .getDashboardData(fetchParams);
    }

    function loadDataFromServer() {
      startProgress();
      const queryUser = isLockedUser ? currentUser : "";
      let fetchParams = { user: queryUser, limit: 15 };
      if (searchQuery.length > 0 || currentDimension === "year") {
        fetchParams = { user: queryUser, all: true };
      } else if (currentDimension === "month") {
        fetchParams = { user: queryUser, limit: 200 };
      }
      google.script.run
        .withSuccessHandler(function(data) {
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.userSettings) {
            syncUserSettingsFromServer(data.userSettings);
          }
          if (data && data.allRecords) {
            allRecords = normalizeRecords(data.allRecords);
            isFullHistoryLoaded = !!data.isCompleteHistory;
            isMonthHistoryLoaded = isFullHistoryLoaded || (fetchParams.limit >= 200);
            setDefaultTimeKey();
            refreshView();
          }
        })
        .withFailureHandler(function() {
          finishProgress();
        })
        .getDashboardData(fetchParams);
    }

    // =====================================================
    // ⚙️ 頁面設定（背景色系 + 個人每月預算，同步寫入 Google Sheet「頁面設定」工作表）
    // =====================================================
    const VALID_THEMES = ["dark", "white", "milktea", "pink", "cyberpunk"];
    const THEME_NAME_MAP = {
      "dark": "原本深色系",
      "white": "白色系",
      "milktea": "奶茶色系",
      "pink": "粉色系",
      "cyberpunk": "賽博朋克色系"
    };

    function syncUserSettingsFromServer(serverSettings) {
      if (!serverSettings) return;
      ["定成", "妤珊"].forEach(u => {
        if (!userSettingsMap[u]) {
          userSettingsMap[u] = { theme: u === "妤珊" ? "milktea" : "dark", monthlyBudget: 0 };
        }
        if (serverSettings[u]) {
          if (serverSettings[u].theme) {
            userSettingsMap[u].theme = serverSettings[u].theme;
            try { localStorage.setItem("theme_" + u, serverSettings[u].theme); } catch (e) {}
          }
          if (serverSettings[u].monthlyBudget !== undefined) {
            const b = parseFloat(serverSettings[u].monthlyBudget);
            const cleanBudget = (!isNaN(b) && b >= 0) ? Math.round(b) : 0;
            userSettingsMap[u].monthlyBudget = cleanBudget;
            try { localStorage.setItem("budget_" + u, String(cleanBudget)); } catch (e) {}
          }
        }
      });
      applyUserTheme(currentUser);
      renderMonthlyBudgetBar();
    }

    function applyUserTheme(user) {
      const targetUser = user || currentUser;
      const defaultTheme = targetUser === "妤珊" ? "milktea" : "dark";
      const userCfg = userSettingsMap[targetUser] || {};
      const currentTheme = userCfg.theme || defaultTheme;
      const safeTheme = VALID_THEMES.indexOf(currentTheme) !== -1 ? currentTheme : defaultTheme;

      document.documentElement.setAttribute("data-theme", safeTheme);
      document.body.setAttribute("data-theme", safeTheme);
      const THEME_BG_MAP = {
        "dark": "#0b0f19",
        "white": "#f8fafc",
        "milktea": "#f6efe6",
        "pink": "#fdf2f8",
        "cyberpunk": "#080012"
      };
      const themeColorMeta = document.getElementById("theme-color-meta") || document.querySelector('meta[name="theme-color"]');
      if (themeColorMeta) {
        themeColorMeta.setAttribute("content", THEME_BG_MAP[safeTheme] || "#0b0f19");
      }

      VALID_THEMES.forEach(t => {
        const btn = document.getElementById("theme-btn-" + t);
        if (btn) {
          btn.className = "theme-option-btn" + (t === safeTheme ? " active" : "");
        }
      });

      const themeLabelEl = document.getElementById("settings-current-theme-label");
      if (themeLabelEl) {
        themeLabelEl.innerText = THEME_NAME_MAP[safeTheme] || "原本深色系";
      }

      const budgetVal = Number(userCfg.monthlyBudget) || 0;
      const budgetLabelEl = document.getElementById("settings-current-budget-label");
      if (budgetLabelEl) {
        budgetLabelEl.innerText = budgetVal > 0 ? `$${budgetVal.toLocaleString()}` : "未設定";
      }
    }

    function openSettingsModal(expandTarget) {
      document.getElementById("settings-modal-heading").innerText = `⚙️ 頁面設定 (${currentUser})`;
      applyUserTheme(currentUser);

      const userCfg = userSettingsMap[currentUser] || {};
      const budgetVal = Number(userCfg.monthlyBudget) || 0;
      const budgetInput = document.getElementById("settings-budget-input");
      if (budgetInput) {
        budgetInput.value = budgetVal > 0 ? budgetVal : "";
      }

      // 預設兩個欄位皆收合，點選對應欄位才展開；若從首頁預算進度條點進來則直接展開預算欄
      const themeItem = document.getElementById("settings-item-theme");
      const budgetItem = document.getElementById("settings-item-budget");
      if (themeItem) themeItem.classList.remove("open");
      if (budgetItem) budgetItem.classList.remove("open");

      if (expandTarget === "budget" && budgetItem) {
        budgetItem.classList.add("open");
        setTimeout(() => { if (budgetInput) budgetInput.focus(); }, 80);
      } else if (expandTarget === "theme" && themeItem) {
        themeItem.classList.add("open");
      }

      document.getElementById("settings-modal").classList.add("open");
    }

    function toggleSettingsSection(secKey) {
      const itemEl = document.getElementById("settings-item-" + secKey);
      if (!itemEl) return;
      const willOpen = !itemEl.classList.contains("open");
      itemEl.classList.toggle("open", willOpen);
      if (willOpen && secKey === "budget") {
        const inp = document.getElementById("settings-budget-input");
        setTimeout(() => { if (inp) inp.focus(); }, 60);
      }
    }

    function closeSettingsModal() {
      document.getElementById("settings-modal").classList.remove("open");
    }

    function selectTheme(themeKey) {
      if (VALID_THEMES.indexOf(themeKey) === -1) return;
      const user = currentUser;
      if (!userSettingsMap[user]) userSettingsMap[user] = { theme: themeKey, monthlyBudget: 0 };
      userSettingsMap[user].theme = themeKey;
      try {
        localStorage.setItem("theme_" + user, themeKey);
      } catch (e) {}

      applyUserTheme(user);
      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          finishProgress();
        })
        .withFailureHandler(function(err) {
          finishProgress();
          alert("設定儲存失敗：" + err.message);
        })
        .saveUserSettings(user, { theme: themeKey });
    }

    function saveMonthlyBudget() {
      const user = currentUser;
      const inp = document.getElementById("settings-budget-input");
      const rawVal = inp ? inp.value.trim() : "";
      const parsed = rawVal === "" ? 0 : Math.round(parseFloat(rawVal));

      if (isNaN(parsed) || parsed < 0) {
        alert("請輸入有效的預算金額（輸入 0 代表不設預算）");
        return;
      }

      if (!userSettingsMap[user]) {
        userSettingsMap[user] = { theme: user === "妤珊" ? "milktea" : "dark", monthlyBudget: 0 };
      }
      userSettingsMap[user].monthlyBudget = parsed;
      try {
        localStorage.setItem("budget_" + user, String(parsed));
      } catch (e) {}

      applyUserTheme(user);
      renderMonthlyBudgetBar();

      const btn = document.getElementById("settings-budget-save-btn");
      if (btn) {
        btn.disabled = true;
        btn.innerText = "儲存中...";
      }
      startProgress();

      google.script.run
        .withSuccessHandler(function() {
          finishProgress();
          if (btn) {
            btn.disabled = false;
            btn.innerText = "儲存";
          }
          const budgetItem = document.getElementById("settings-item-budget");
          if (budgetItem) budgetItem.classList.remove("open");
        })
        .withFailureHandler(function(err) {
          finishProgress();
          if (btn) {
            btn.disabled = false;
            btn.innerText = "儲存";
          }
          alert("預算儲存失敗：" + err.message);
        })
        .saveUserSettings(user, { monthlyBudget: parsed });
    }

    // ⚡ 第二段載入：點選「月」或往前翻閱幾天時，只快速載入最新 200 筆（涵蓋近兩個月）
    function loadMonthHistoryFromServer() {
      if (isLoadingMonthHistory || isMonthHistoryLoaded || isFullHistoryLoaded) return;
      isLoadingMonthHistory = true;
      startProgress();
      const queryUser = isLockedUser ? currentUser : "";
      google.script.run
        .withSuccessHandler(function(data) {
          isLoadingMonthHistory = false;
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.allRecords) {
            allRecords = normalizeRecords(data.allRecords);
            isMonthHistoryLoaded = true;
            refreshView();
          }
        })
        .withFailureHandler(function() {
          isLoadingMonthHistory = false;
          finishProgress();
        })
        .getDashboardData({ user: queryUser, limit: 200 });
    }

    // ⚡ 第三段載入：當點選「年」、搜尋關鍵字或查詢更早歷史時，背景載入完整歷史紀錄
    function loadFullHistoryFromServer() {
      if (isLoadingFullHistory || isFullHistoryLoaded) return;
      isLoadingFullHistory = true;
      startProgress();
      const queryUser = isLockedUser ? currentUser : "";
      google.script.run
        .withSuccessHandler(function(data) {
          isLoadingFullHistory = false;
          finishProgress();
          if (data && data.monthlyExpenses) {
            monthlyExpensesMap = data.monthlyExpenses;
          }
          if (data && data.allRecords) {
            allRecords = normalizeRecords(data.allRecords);
            isMonthHistoryLoaded = true;
            isFullHistoryLoaded = true;
            refreshView();
          }
        })
        .withFailureHandler(function() {
          isLoadingFullHistory = false;
          finishProgress();
        })
        .getDashboardData({ user: queryUser, all: true });
    }

    // =====================================================
    // 🩺 除錯與重複偵測中心操作（點開查看後紅色警告立即消失！）
    // =====================================================
    let currentAuditDays = 7;

    function openAuditCenter() {
      // ✅ 點開查看後，紅色橫幅與紅點立即消失！
      hasViewedAuditBanner = true;
      document.getElementById("main-alert-banner").style.display = "none";
      document.getElementById("audit-badge").style.display = "none";
      try {
        if (lastAuditIssueSig) {
          localStorage.setItem("dismissed_audit_sig", lastAuditIssueSig);
        }
      } catch (e) {}

      document.getElementById("audit-modal").classList.add("open");
      runAuditWithDays(currentAuditDays);
    }

    function closeAuditModal() {
      document.getElementById("audit-modal").classList.remove("open");
    }

    function runAuditWithDays(days) {
      currentAuditDays = days;
      document.getElementById("audit-tab-7").className = "audit-tab-btn" + (days === 7 ? " active" : "");
      document.getElementById("audit-tab-30").className = "audit-tab-btn" + (days === 30 ? " active" : "");
      document.getElementById("audit-tab-all").className = "audit-tab-btn" + (days === "ALL" ? " active" : "");

      const box = document.getElementById("audit-results-container");
      box.innerHTML = `<div class="empty-msg">⏳ 正在掃描 ${days === "ALL" ? "全部歷史" : `近 ${days} 天`} 的重複與異常資料...</div>`;

      google.script.run
        .withSuccessHandler(function(report) {
          const issues = (report && report.issues) ? report.issues : [];
          lastAuditIssues = issues;

          // 儲存目前已看過的異常簽名，確保點開查看後紅色警告不再亮起
          const sig = issues.map(x => `${x.user}_${x.rowIndex}_${x.recordedAt}_${x.amount}`).join("|");
          lastAuditIssueSig = sig;
          try {
            localStorage.setItem("dismissed_audit_sig", sig);
          } catch (e) {}
          document.getElementById("audit-badge").style.display = "none";
          document.getElementById("main-alert-banner").style.display = "none";

          if (issues.length === 0) {
            box.innerHTML = `
              <div style="background:rgba(74,140,111,0.12); border:1px solid #4a8c6f; border-radius:12px; padding:20px; text-align:center; color:#386e56;">
                <div style="font-size:2rem; margin-bottom:6px;">✅</div>
                <strong style="font-size:0.92rem;">沒有發現任何重複或異常資料！</strong>
              </div>
            `;
            return;
          }

          let html = `<div style="font-weight:800; font-size:0.85rem; color:#b45309; margin-bottom:8px;">⚠️ 發現 ${issues.length} 筆重複 / 疑似相近消費：</div>`;
          html += issues.map((item, idx) => `
            <div class="audit-item">
              <div class="audit-item-top">
                <span class="audit-badge-warn">[${escapeHtml(item.user)}] ${escapeHtml(item.type)}</span>
                <span style="font-size:0.75rem; color:var(--text-muted);">第 ${item.rowIndex} 列</span>
              </div>
              <div class="audit-item-desc">${escapeHtml(item.reason)}</div>
              <div class="audit-item-btns">
                <button type="button" class="rec-btn-mini" onclick="editAuditItem(${idx})">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                  <span>編輯</span>
                </button>
                <button type="button" class="rec-btn-mini del" onclick="deleteDuplicateItem(${idx})">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
                  <span>刪除此筆</span>
                </button>
              </div>
            </div>
          `).join("");

          box.innerHTML = html;
        })
        .withFailureHandler(function(err) {
          box.innerHTML = `<div class="empty-msg" style="color:#ef4444;">❌ 掃描失敗：${escapeHtml(err.message)}</div>`;
        })
        .scanDuplicatesAndAnomalies(days, currentUser);
    }

    function editAuditItem(issueIdx) {
      const item = lastAuditIssues[issueIdx];
      if (!item) return;
      closeAuditModal();
      openEditModalWithRecordObj({
        user: item.user,
        rowIndex: item.rowIndex,
        Account: item.account || "現金",
        "Account ID": item.accountId || 0,
        Category: item.category || "食物",
        Amount: item.amount,
        "Recorded At": item.recordedAt,
        note: item.note || ""
      });
    }

    function deleteDuplicateItem(issueIdx) {
      const item = lastAuditIssues[issueIdx];
      if (!item) return;
      if (!confirm(`確定要刪除【${item.user}】第 ${item.rowIndex} 列（${item.note} $${item.amount}）的重複紀錄嗎？`)) return;

      startProgress();
      google.script.run
        .withSuccessHandler(function() {
          finishProgress();
          triggerManualRefresh();
          runAuditWithDays(currentAuditDays);
        })
        .withFailureHandler(function(err) {
          finishProgress();
          alert("刪除失敗：" + err.message);
        })
        .deleteRecordByRow(item.user, item.rowIndex, {
          recordedAt: item.recordedAt,
          amount: item.amount,
          note: item.note
        });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =====================================================
    // 📊 週報 / 月報 / 年報消費比較分析引擎（方式 A：點選右上角按鈕才載入與顯示）
    // =====================================================
    let currentReportTab = "weekly"; // "weekly" | "monthly" | "yearly"
    let reportWeekOffset = 0;        // 0=本週, -1=上週, -2=前週...
    let reportMonthOffset = 0;       // 0=本月, -1=上月...
    let reportYearOffset = 0;        // 0=今年, -1=去年, -2=前年...
    let expandedReportCats = {};     // 記錄展開查看明細的類別

    function openReportModal(tab) {
      if (tab) currentReportTab = tab;
      reportWeekOffset = 0;
      reportMonthOffset = 0;
      reportYearOffset = 0;
      expandedReportCats = {};
      document.getElementById("rep-tab-weekly").className = "report-seg-btn" + (currentReportTab === "weekly" ? " active" : "");
      document.getElementById("rep-tab-monthly").className = "report-seg-btn" + (currentReportTab === "monthly" ? " active" : "");
      document.getElementById("rep-tab-yearly").className = "report-seg-btn" + (currentReportTab === "yearly" ? " active" : "");
      document.getElementById("report-modal-overlay").classList.add("open");
      document.body.style.overflow = "hidden";
      document.documentElement.style.overflow = "hidden";

      // 若尚未載入完整歷史資料，點選年報或翻查前期時自動在背景補齊
      if (currentReportTab === "yearly" || reportWeekOffset !== 0 || reportMonthOffset !== 0) {
        if (!isFullHistoryLoaded) loadFullHistoryFromServer();
      } else if (!isMonthHistoryLoaded && !isFullHistoryLoaded) {
        loadMonthHistoryFromServer();
      }
      renderReportModal();
    }

    function closeReportModal() {
      document.getElementById("report-modal-overlay").classList.remove("open");
      document.body.style.overflow = "";
      document.documentElement.style.overflow = "";
    }

    function switchReportTab(tab) {
      currentReportTab = tab;
      expandedReportCats = {};
      document.getElementById("rep-tab-weekly").className = "report-seg-btn" + (tab === "weekly" ? " active" : "");
      document.getElementById("rep-tab-monthly").className = "report-seg-btn" + (tab === "monthly" ? " active" : "");
      document.getElementById("rep-tab-yearly").className = "report-seg-btn" + (tab === "yearly" ? " active" : "");
      if (tab === "yearly" && !isFullHistoryLoaded) {
        loadFullHistoryFromServer();
      }
      renderReportModal();
    }

    function stepReportPeriod(dir) {
      expandedReportCats = {};
      if (currentReportTab === "weekly") {
        reportWeekOffset = Math.min(0, reportWeekOffset + dir);
      } else if (currentReportTab === "monthly") {
        reportMonthOffset = Math.min(0, reportMonthOffset + dir);
      } else if (currentReportTab === "yearly") {
        reportYearOffset = Math.min(0, reportYearOffset + dir);
      }
      if (!isFullHistoryLoaded) {
        loadFullHistoryFromServer();
      }
      renderReportModal();
    }

    function toggleReportCatExpand(cat) {
      expandedReportCats[cat] = !expandedReportCats[cat];
      renderReportModal();
    }

    let isReportCurveDragging = false;
    let lastScrubbedDayIdx = -1;

    function toggleReportBarDay(dateStr) {
      const targetKey = "bar_" + dateStr;
      const isCurrentlyOpen = !!expandedReportCats[targetKey];
      // 清除其他長條/日期的選取狀態，保持單選
      Object.keys(expandedReportCats).forEach(k => {
        if (k.startsWith("bar_")) delete expandedReportCats[k];
      });
      if (!isCurrentlyOpen) {
        expandedReportCats[targetKey] = true;
      }
      lastScrubbedDayIdx = -1;
      renderReportModal();
    }

    function onReportCurvePointerDown(e) {
      isReportCurveDragging = true;
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      handleReportCurvePointer(e, true);
    }

    function onReportCurvePointerMove(e) {
      // 支援滑鼠靠過去（hover）或按壓拖曳（drag / scrub）
      handleReportCurvePointer(e, false);
    }

    function onReportCurvePointerUp(e) {
      isReportCurveDragging = false;
      try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    function handleReportCurvePointer(e, isClick) {
      if (!window.reportCurrentCtx || window.reportCurrentCtx.isWeekly || window.reportCurrentCtx.isYearly) return;
      const container = document.getElementById("rep-curve-chart-container");
      if (!container) return;
      const rect = container.getBoundingClientRect();
      if (rect.width <= 0) return;

      const relX = e.clientX - rect.left;
      const W = 340;
      const pLeft = 8;
      const pRight = 8;
      const cW = W - pLeft - pRight;
      
      const svgX = (relX / rect.width) * W;
      const ratio = (svgX - pLeft) / cW;
      const N = window.reportCurrentCtx.bars.length;
      const rawIdx = Math.round(ratio * (N - 1));
      const dayIdx = Math.max(0, Math.min(N - 1, rawIdx));

      if (isClick && dayIdx === lastScrubbedDayIdx) {
        toggleReportBarDay(window.reportCurrentCtx.bars[dayIdx].fullDate);
        lastScrubbedDayIdx = -1;
        return;
      }

      if (dayIdx !== lastScrubbedDayIdx || isClick) {
        lastScrubbedDayIdx = dayIdx;
        selectReportDayByIndex(dayIdx);
      }
    }

    function selectReportDayByIndex(dayIdx) {
      const ctx = window.reportCurrentCtx;
      if (!ctx || !ctx.bars || !ctx.bars[dayIdx]) return;
      const b = ctx.bars[dayIdx];
      const targetKey = "bar_" + b.fullDate;

      Object.keys(expandedReportCats).forEach(k => {
        if (k.startsWith("bar_")) delete expandedReportCats[k];
      });
      expandedReportCats[targetKey] = true;

      const cursorGroup = document.getElementById("rep-curve-interactive-cursor");
      const drawerContainer = document.getElementById("rep-chart-active-drawer");

      if (cursorGroup && drawerContainer) {
        const W = 340;
        const H = 100;
        const pLeft = 8;
        const pRight = 8;
        const pTop = 16;
        const pBottom = 16;
        const cW = W - pLeft - pRight;
        const cH = H - pTop - pBottom;
        const N = ctx.bars.length;
        const maxBarAmt = Math.max(...ctx.bars.map(x => x.amt), 1);

        const x = pLeft + (dayIdx * cW) / Math.max(1, N - 1);
        const ratio = maxBarAmt > 0 ? (b.amt / maxBarAmt) : 0;
        const y = pTop + cH - (ratio * cH);

        const badgeX = Math.max(26, Math.min(W - 26, x));
        const badgeY = Math.max(11, y - 8);
        const valStr = b.amt > 0 ? (b.amt >= 10000 ? "$" + (b.amt / 1000).toFixed(1) + "k" : "$" + b.amt.toLocaleString()) : "$0";

        cursorGroup.style.display = "block";
        cursorGroup.innerHTML = `
          <line x1="${x.toFixed(1)}" y1="${pTop - 4}" x2="${x.toFixed(1)}" y2="${(pTop + cH).toFixed(1)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2.5,2.5" />
          <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" />
          <g transform="translate(${badgeX.toFixed(1)}, ${badgeY.toFixed(1)})">
            <rect x="-22" y="-12" width="44" height="15" rx="4" fill="var(--accent)" />
            <text x="0" y="-1.5" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">${valStr}</text>
          </g>
        `;

        const dayRecordsMap = window.reportDayRecordsMap || {};
        const dayRecs = (dayRecordsMap[b.fullDate] || []).slice().sort((p, q) => (Number(q.Amount) || 0) - (Number(p.Amount) || 0));
        const dayRows = dayRecs.length === 0
          ? `<div style="font-size:0.73rem;color:var(--text-muted);padding:4px 6px;">當日無支出紀錄</div>`
          : dayRecs.map(r => {
              const tStr = String(r["Recorded At"] || "").slice(11, 16) || r.Category || "";
              const nStr = escapeHtml(r.note || r.Category || "項目");
              const aNum = Math.round(Number(r.Amount) || 0);
              return `
                <div class="rep-cat-rec-mini-row">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                    <span style="color:var(--text-muted);font-size:0.7rem;flex-shrink:0;">${escapeHtml(tStr)}</span>
                    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${nStr}</span>
                  </div>
                  <span style="font-weight:800;flex-shrink:0;">$${aNum.toLocaleString()}</span>
                </div>
              `;
            }).join("");

        drawerContainer.style.display = "flex";
        drawerContainer.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 4px;font-size:0.76rem;font-weight:800;color:var(--text);">
            <span>${b.fullDate}${b.wLbl ? " (" + b.wLbl + ")" : ""}</span>
            <span style="color:var(--expense);font-weight:900;">$${(b.amt || 0).toLocaleString()}</span>
          </div>
          ${dayRows}
        `;
      } else {
        renderReportModal();
      }
    }

    function formatYAxis(amt) {
      if (!amt || amt <= 0) return "0";
      if (amt >= 1000000) return (amt / 1000000).toFixed(1) + "M";
      if (amt >= 100000) return Math.round(amt / 1000) + "k";
      if (amt >= 10000) return (amt / 1000).toFixed(1) + "k";
      return amt.toLocaleString();
    }

    // 點擊單日最高峰或 Top 1~3 項目 -> 關閉財報並直接跳到「那一天」
    function jumpToReportDate(dateYMD) {
      if (!dateYMD || dateYMD.length < 10) return;
      closeReportModal();
      currentDimension = "day";
      currentTimeKey = dateYMD.slice(0, 10);
      selectedCategoryFilter = "";
      document.getElementById("btn-dim-day").className = "dim-mini-btn active";
      document.getElementById("btn-dim-month").className = "dim-mini-btn";
      document.getElementById("btn-dim-year").className = "dim-mini-btn";
      listRenderLimit = 150;
      refreshView();
    }

    // 點擊「最常消費類別」 -> 關閉財報並跳到主畫面篩選該類別
    function jumpToReportCategory(cat, targetYM) {
      if (!cat) return;
      closeReportModal();
      currentDimension = "month";
      currentTimeKey = targetYM || getTodayString().slice(0, 7);
      selectedCategoryFilter = cat;
      document.getElementById("btn-dim-day").className = "dim-mini-btn";
      document.getElementById("btn-dim-month").className = "dim-mini-btn active";
      document.getElementById("btn-dim-year").className = "dim-mini-btn";
      listRenderLimit = 150;
      refreshView();
    }

    function formatYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}/${m}/${day}`;
    }

    function formatMD(d) {
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${m}/${day}`;
    }

    function getWeekRangeByOffset(offsetWeeks) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dow = today.getDay();
      const diffToMon = (dow === 0 ? -6 : 1 - dow);
      const mon = new Date(today.getFullYear(), today.getMonth(), today.getDate() + diffToMon + (offsetWeeks * 7));
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      return { mon, sun, today };
    }

    function renderReportModal() {
      const titleEl = document.getElementById("rep-modal-user-title");
      if (titleEl) titleEl.innerText = `${currentUser}・消費回顧與對比`;
      const body = document.getElementById("report-modal-body");
      if (!body) return;

      const userExpRecords = allRecords.filter(r => r.user === currentUser && r.Category !== "收入" && (Number(r.Amount) || 0) > 0);

      if (currentReportTab === "weekly") {
        const currRange = getWeekRangeByOffset(reportWeekOffset);
        const prevRange = getWeekRangeByOffset(reportWeekOffset - 1);

        // 計算本週已過天數（若為「本週 reportWeekOffset === 0」，僅比較本週前 N 天 vs 上週前 N 天；若為過去週則完整 7 天比 7 天）
        const dayNames = ["一", "二", "三", "四", "五", "六", "日"];
        const todayStr = formatYMD(currRange.today);
        let elapsedDaysInWeek = 7;
        if (reportWeekOffset === 0) {
          const dow = currRange.today.getDay();
          elapsedDaysInWeek = (dow === 0) ? 7 : dow;
        }

        const currStartStr = formatYMD(currRange.mon);
        const currCompareEndObj = new Date(currRange.mon.getFullYear(), currRange.mon.getMonth(), currRange.mon.getDate() + (elapsedDaysInWeek - 1));
        const currCompareEndStr = formatYMD(currCompareEndObj);

        const prevStartStr = formatYMD(prevRange.mon);
        const prevCompareEndObj = new Date(prevRange.mon.getFullYear(), prevRange.mon.getMonth(), prevRange.mon.getDate() + (elapsedDaysInWeek - 1));
        const prevCompareEndStr = formatYMD(prevCompareEndObj);

        const currRecs = userExpRecords.filter(r => {
          const d = String(r["Recorded At"] || "").slice(0, 10);
          return d >= currStartStr && d <= currCompareEndStr;
        });
        const prevRecs = userExpRecords.filter(r => {
          const d = String(r["Recorded At"] || "").slice(0, 10);
          return d >= prevStartStr && d <= prevCompareEndStr;
        });

        const currTotal = Math.round(currRecs.reduce((s, r) => s + (Number(r.Amount) || 0), 0));
        const prevTotal = Math.round(prevRecs.reduce((s, r) => s + (Number(r.Amount) || 0), 0));

        let sum4W = 0;
        let count4W = 0;
        for (let w = 1; w <= 4; w++) {
          const wr = getWeekRangeByOffset(reportWeekOffset - w);
          const ws = formatYMD(wr.mon);
          const weObj = new Date(wr.mon.getFullYear(), wr.mon.getMonth(), wr.mon.getDate() + (elapsedDaysInWeek - 1));
          const we = formatYMD(weObj);
          const wSum = userExpRecords.reduce((s, r) => {
            const d = String(r["Recorded At"] || "").slice(0, 10);
            return (d >= ws && d <= we) ? s + (Number(r.Amount) || 0) : s;
          }, 0);
          if (wSum > 0) {
            sum4W += wSum;
            count4W++;
          }
        }
        const avg4Weeks = count4W > 0 ? Math.round(sum4W / count4W) : prevTotal;

        // 週一～週日 7 天柱狀圖
        const dailyBars = [];
        for (let i = 0; i < 7; i++) {
          const dObj = new Date(currRange.mon.getFullYear(), currRange.mon.getMonth(), currRange.mon.getDate() + i);
          const dStr = formatYMD(dObj);
          const dSum = Math.round(currRecs.reduce((s, r) => String(r["Recorded At"] || "").slice(0, 10) === dStr ? s + (Number(r.Amount) || 0) : s, 0));
          const isToday = (reportWeekOffset === 0 && dStr === todayStr);
          dailyBars.push({ lbl: dayNames[i], wLbl: "週" + dayNames[i], dateStr: formatMD(dObj), fullDate: dStr, amt: dSum, isToday });
        }

        const isPartialWeek = (reportWeekOffset === 0 && elapsedDaysInWeek < 7);
        renderReportContent(body, {
          isWeekly: true,
          isPartial: isPartialWeek,
          elapsedDays: elapsedDaysInWeek,
          targetYM: currStartStr.slice(0, 7),
          periodTitle: `${reportWeekOffset === 0 ? "本週" : (reportWeekOffset === -1 ? "上週" : `前 ${Math.abs(reportWeekOffset)} 週`)} (${formatMD(currRange.mon)} ～ ${formatMD(currRange.sun)})`,
          canNext: reportWeekOffset < 0,
          currTotal,
          prevTotal,
          avg4Weeks,
          dailyAvg: Math.round(currTotal / elapsedDaysInWeek),
          bars: dailyBars,
          currRecs,
          prevRecs
        });
      } else if (currentReportTab === "monthly") {
        // 🗓️ 月報結算（若為「本月 reportMonthOffset === 0」，僅比較本月 1~今天幾號 vs 上月 1~同日；過去月份則整月比整月）
        const now = new Date();
        const targetDate = new Date(now.getFullYear(), now.getMonth() + reportMonthOffset, 1);
        const prevDate = new Date(targetDate.getFullYear(), targetDate.getMonth() - 1, 1);

        const currYM = `${targetDate.getFullYear()}/${String(targetDate.getMonth() + 1).padStart(2, "0")}`;
        const prevYM = `${prevDate.getFullYear()}/${String(prevDate.getMonth() + 1).padStart(2, "0")}`;

        const totalDaysInMonth = new Date(targetDate.getFullYear(), targetDate.getMonth() + 1, 0).getDate() || 30;
        const elapsedDays = (reportMonthOffset === 0) ? Math.max(1, now.getDate()) : totalDaysInMonth;
        const isPartialMonth = (reportMonthOffset === 0 && elapsedDays < totalDaysInMonth);

        const currRecs = userExpRecords.filter(r => {
          const d = String(r["Recorded At"] || "");
          if (d.slice(0, 7) !== currYM) return false;
          if (isPartialMonth) {
            const dayNum = parseInt(d.slice(8, 10), 10) || 1;
            return dayNum <= elapsedDays;
          }
          return true;
        });

        const prevRecs = userExpRecords.filter(r => {
          const d = String(r["Recorded At"] || "");
          if (d.slice(0, 7) !== prevYM) return false;
          if (isPartialMonth) {
            const dayNum = parseInt(d.slice(8, 10), 10) || 1;
            return dayNum <= elapsedDays;
          }
          return true;
        });

        const currTotal = Math.round(currRecs.reduce((s, r) => s + (Number(r.Amount) || 0), 0));
        const prevTotal = Math.round(prevRecs.reduce((s, r) => s + (Number(r.Amount) || 0), 0));

        const userCfg = userSettingsMap[currentUser] || {};
        const budget = Number(userCfg.monthlyBudget) || 0;

        // 當月每日 (1日 ~ 28/30/31日) 花費分佈
        const dailyBars = [];
        const isCurrentMonth = (reportMonthOffset === 0);
        const todayNum = now.getDate();
        const wNames = ["日", "一", "二", "三", "四", "五", "六"];
        for (let d = 1; d <= totalDaysInMonth; d++) {
          const dObj = new Date(targetDate.getFullYear(), targetDate.getMonth(), d);
          const dStr = `${currYM}/${String(d).padStart(2, "0")}`;
          const dSum = Math.round(currRecs.reduce((s, r) => String(r["Recorded At"] || "").slice(0, 10) === dStr ? s + (Number(r.Amount) || 0) : s, 0));
          const isToday = isCurrentMonth && (d === todayNum);
          dailyBars.push({
            lbl: isToday ? "今" : `${d}`,
            wLbl: "週" + wNames[dObj.getDay()],
            dayNum: d,
            fullDate: dStr,
            amt: dSum,
            isToday,
            isFuture: isCurrentMonth && (d > todayNum)
          });
        }

        renderReportContent(body, {
          isWeekly: false,
          isYearly: false,
          isPartial: isPartialMonth,
          elapsedDays,
          targetYM: currYM,
          periodTitle: `${targetDate.getFullYear()}年 ${targetDate.getMonth() + 1}月`,
          canNext: reportMonthOffset < 0,
          currTotal,
          prevTotal,
          budget,
          dailyAvg: Math.round(currTotal / elapsedDays),
          bars: dailyBars,
          currRecs,
          prevRecs
        });
      } else if (currentReportTab === "yearly") {
        // 📅 年報結算（若為「今年 reportYearOffset === 0」，比較今年 1/1~今天 vs 去年 1/1~同月同日；過去年份則整年比整年）
        const now = new Date();
        const targetYear = now.getFullYear() + reportYearOffset;
        const prevYear = targetYear - 1;
        const targetYearStr = String(targetYear);
        const prevYearStr = String(prevYear);

        const isCurrentYear = (reportYearOffset === 0);
        const todayMonth = now.getMonth() + 1; // 1~12
        const todayMD = String(todayMonth).padStart(2, "0") + "/" + String(now.getDate()).padStart(2, "0");

        // 計算今年已過天數（以 1/1 起算）
        const startOfYear = new Date(targetYear, 0, 1);
        const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        const totalDaysInYear = isLeap(targetYear) ? 366 : 365;
        const elapsedDays = isCurrentYear ? Math.max(1, Math.min(totalDaysInYear, Math.floor((now - startOfYear) / 86400000) + 1)) : totalDaysInYear;
        const isPartialYear = isCurrentYear && (elapsedDays < totalDaysInYear);

        const currRecs = userExpRecords.filter(r => {
          const d = String(r["Recorded At"] || "");
          if (d.slice(0, 4) !== targetYearStr) return false;
          if (isPartialYear) {
            return d.slice(5, 10) <= todayMD;
          }
          return true;
        });

        const prevRecs = userExpRecords.filter(r => {
          const d = String(r["Recorded At"] || "");
          if (d.slice(0, 4) !== prevYearStr) return false;
          if (isPartialYear) {
            return d.slice(5, 10) <= todayMD;
          }
          return true;
        });

        const currTotal = Math.round(currRecs.reduce((s, r) => s + (Number(r.Amount) || 0), 0));
        const prevTotal = Math.round(prevRecs.reduce((s, r) => s + (Number(r.Amount) || 0), 0));

        // 12 個月份 (1月 ~ 12月) 花費分佈
        const monthlyBars = [];
        const elapsedMonths = isCurrentYear ? todayMonth : 12;

        for (let m = 1; m <= 12; m++) {
          const mStr = `${targetYearStr}/${String(m).padStart(2, "0")}`;
          const isThisMonth = isCurrentYear && (m === todayMonth);
          const isFutureMonth = isCurrentYear && (m > todayMonth);

          const mSum = Math.round(currRecs.reduce((s, r) => {
            const d = String(r["Recorded At"] || "").slice(0, 7);
            return d === mStr ? s + (Number(r.Amount) || 0) : s;
          }, 0));

          monthlyBars.push({
            lbl: `${m}月`,
            wLbl: `${targetYearStr}年 ${m}月`,
            monthNum: m,
            fullDate: mStr,
            amt: mSum,
            isToday: isThisMonth,
            isFuture: isFutureMonth
          });
        }

        renderReportContent(body, {
          isWeekly: false,
          isYearly: true,
          isPartial: isPartialYear,
          elapsedDays,
          elapsedMonths,
          targetYear,
          periodTitle: `${targetYear} 年${isCurrentYear ? " (今年)" : ""}`,
          canNext: reportYearOffset < 0,
          currTotal,
          prevTotal,
          monthlyAvg: Math.round(currTotal / Math.max(1, elapsedMonths)),
          dailyAvg: Math.round(currTotal / Math.max(1, elapsedDays)),
          bars: monthlyBars,
          currRecs,
          prevRecs
        });
      }
    }

    function renderReportContent(body, ctx) {
      const isWeekly = !!ctx.isWeekly;
      const isYearly = !!ctx.isYearly;
      const diff = ctx.currTotal - ctx.prevTotal;
      const pct = ctx.prevTotal > 0 ? ((Math.abs(diff) / ctx.prevTotal) * 100).toFixed(1) : "0.0";
      const isUp = diff > 0;
      const deltaClass = isUp ? "up" : "down";
      const prevName = isWeekly
        ? (ctx.isPartial ? `上週前${ctx.elapsedDays}天` : "上週")
        : (isYearly
          ? (ctx.isPartial ? `去年同期` : "去年")
          : (ctx.isPartial ? `上月前${ctx.elapsedDays}天` : "上月"));
      const shortPrevName = isWeekly ? "上週" : (isYearly ? "去年" : "上月");

      const deltaLabel = ctx.prevTotal === 0
        ? `${prevName} $0`
        : (isUp
          ? `▲ +$${diff.toLocaleString()} (+${pct}%)`
          : `▼ -$${Math.abs(diff).toLocaleString()} (-${pct}%)`);

      // 每日消費彙整地圖（供柱狀圖點擊與單日最高峰使用）
      const daySumMap = {};
      const dayRecordsMap = {};
      ctx.currRecs.forEach(r => {
        const d = String(r["Recorded At"] || "").slice(0, 10);
        if (d) {
          daySumMap[d] = (daySumMap[d] || 0) + (Number(r.Amount) || 0);
          if (!dayRecordsMap[d]) dayRecordsMap[d] = [];
          dayRecordsMap[d].push(r);
        }
      });

      // 各類別本期 vs 上期統計
      const catSet = new Set();
      const currCatMap = {};
      const prevCatMap = {};
      const currCatCount = {};
      const currCatRecords = {};

      ctx.currRecs.forEach(r => {
        const c = r.Category || "其他";
        catSet.add(c);
        currCatMap[c] = (currCatMap[c] || 0) + (Number(r.Amount) || 0);
        currCatCount[c] = (currCatCount[c] || 0) + 1;
        if (!currCatRecords[c]) currCatRecords[c] = [];
        currCatRecords[c].push(r);
      });
      ctx.prevRecs.forEach(r => {
        const c = r.Category || "其他";
        catSet.add(c);
        prevCatMap[c] = (prevCatMap[c] || 0) + (Number(r.Amount) || 0);
      });

      const catDeltaList = Array.from(catSet).map(cat => ({
        cat,
        curr: Math.round(currCatMap[cat] || 0),
        prev: Math.round(prevCatMap[cat] || 0),
        diff: Math.round((currCatMap[cat] || 0) - (prevCatMap[cat] || 0)),
        count: currCatCount[cat] || 0,
        records: (currCatRecords[cat] || []).slice().sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0))
      })).sort((a, b) => (b.curr - a.curr) || (b.prev - a.prev));

      // 找出增加最多與減少最多的類別（用於第一區塊圖像化小卡）
      const mostGrown = catDeltaList.slice().sort((a, b) => b.diff - a.diff)[0];
      const mostSaved = catDeltaList.slice().sort((a, b) => a.diff - b.diff)[0];
      const swingUpHtml = (mostGrown && mostGrown.diff > 0)
        ? `<div class="rep-swing-row up"><span>▲ ${mostGrown.cat}</span><span>+$${mostGrown.diff.toLocaleString()}</span></div>`
        : `<div class="rep-swing-row" style="color:var(--text-muted);"><span>▲ 無增加類別</span></div>`;
      const swingDownHtml = (mostSaved && mostSaved.diff < 0)
        ? `<div class="rep-swing-row down"><span>▼ ${mostSaved.cat}</span><span>-$${Math.abs(mostSaved.diff).toLocaleString()}</span></div>`
        : `<div class="rep-swing-row" style="color:var(--text-muted);"><span>▼ 無減少類別</span></div>`;

      const heroTitleText = isWeekly
        ? (ctx.isPartial ? `本週支出 (前${ctx.elapsedDays}天)` : "當週總支出")
        : (isYearly
          ? (ctx.isPartial ? `本年支出 (前${ctx.elapsedDays}天)` : "當年度總支出")
          : (ctx.isPartial ? `本月支出 (前${ctx.elapsedDays}天)` : "當月總支出"));

      const tile2SubText = isWeekly
        ? `近4週均 $${(ctx.avg4Weeks || 0).toLocaleString()}`
        : (isYearly
          ? `日均 $${(ctx.dailyAvg || 0).toLocaleString()}`
          : (ctx.budget > 0
            ? (ctx.budget - ctx.currTotal >= 0 ? `預算剩 $${(ctx.budget - ctx.currTotal).toLocaleString()}` : `超支 $${Math.abs(ctx.budget - ctx.currTotal).toLocaleString()}`)
            : "未設定預算"));

      window.reportCurrentCtx = ctx;
      window.reportDayRecordsMap = dayRecordsMap;
      window.reportDaySumMap = daySumMap;

      // 找出當前被選取的單一日期/月份（支援週報長條、年報月份長條、月報曲線單選點擊）
      const maxBarAmt = Math.max(...ctx.bars.map(b => b.amt), 1);
      let activeBarDrawerContent = "";
      const activeBarDayKey = Object.keys(expandedReportCats).find(k => k.startsWith("bar_") && expandedReportCats[k]);
      if (activeBarDayKey) {
        const activeDateStr = activeBarDayKey.replace("bar_", "");
        const activeBarObj = ctx.bars.find(b => b.fullDate === activeDateStr) || {
          fullDate: activeDateStr,
          amt: Math.round(daySumMap[activeDateStr] || 0)
        };
        const dayRecs = isYearly
          ? ctx.currRecs.filter(r => String(r["Recorded At"] || "").slice(0, 7) === activeDateStr).sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0))
          : (dayRecordsMap[activeDateStr] || []).slice().sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0));

        const renderRecs = dayRecs.slice(0, 60);
        const dayRows = dayRecs.length === 0
          ? `<div style="font-size:0.73rem;color:var(--text-muted);padding:4px 6px;">該期間無支出紀錄</div>`
          : renderRecs.map(r => {
              const fullD = String(r["Recorded At"] || "");
              const tStr = isYearly ? fullD.slice(5, 10) : (fullD.slice(11, 16) || r.Category || "");
              const nStr = escapeHtml(r.note || r.Category || "項目");
              const aNum = Math.round(Number(r.Amount) || 0);
              return `
                <div class="rep-cat-rec-mini-row">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                    <span style="color:var(--text-muted);font-size:0.7rem;flex-shrink:0;">${escapeHtml(tStr)}</span>
                    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${nStr}</span>
                  </div>
                  <span style="font-weight:800;flex-shrink:0;">$${aNum.toLocaleString()}</span>
                </div>
              `;
            }).join("");

        const countNotice = dayRecs.length > 60 ? `<div style="font-size:0.68rem;color:var(--text-muted);text-align:center;padding:4px 0;">僅顯示單筆前 60 筆（共 ${dayRecs.length} 筆）</div>` : "";

        activeBarDrawerContent = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 4px;font-size:0.76rem;font-weight:800;color:var(--text);width:100%;">
            <span>${activeBarObj.wLbl || activeBarObj.fullDate}${activeBarObj.lbl && !isYearly ? " (" + activeBarObj.lbl + ")" : ""} (共 ${dayRecs.length} 筆)</span>
            <span style="color:var(--expense);font-weight:900;">$${(activeBarObj.amt || 0).toLocaleString()}</span>
          </div>
          ${dayRows}
          ${countNotice}
        `;
      }

      // 圖表 HTML：週報使用週一～週日 7 天柱狀圖；年報使用 1~12 月 12 個月柱狀圖；月報使用全月 1..30/31 日平滑曲線走勢圖 + 左側 Y 軸金額
      let chartHtml = "";
      if (isWeekly || isYearly) {
        const barsHtml = ctx.bars.map(b => {
          const hPx = b.amt === 0 ? 4 : Math.max(12, Math.round((b.amt / maxBarAmt) * 76));
          const isPeak = b.amt === maxBarAmt && b.amt > 0;
          const barKey = "bar_" + b.fullDate;
          const isBarExp = !!expandedReportCats[barKey];

          let valText = "-";
          if (b.amt > 0) {
            if (isYearly) {
              if (b.amt >= 10000) {
                valText = "$" + Math.round(b.amt / 1000) + "k";
              } else if (b.amt >= 1000) {
                valText = "$" + (b.amt / 1000).toFixed(1) + "k";
              } else {
                valText = "$" + b.amt;
              }
            } else {
              valText = b.amt >= 10000 ? "$" + (b.amt / 1000).toFixed(1) + "k" : "$" + b.amt.toLocaleString();
            }
          }

          return `
            <div class="rep-bar-col ${b.isToday ? "today" : ""} ${isBarExp ? "active-bar" : ""}" onclick="toggleReportBarDay('${b.fullDate}')" title="${b.wLbl || b.fullDate}: $${b.amt.toLocaleString()}">
              <span class="rep-bar-val ${b.amt === 0 ? "dim" : ""}">${valText}</span>
              <div class="rep-bar-fill ${b.amt === 0 ? "zero" : (isPeak ? "peak" : "")}" style="height:${hPx}px;"></div>
              <span class="rep-bar-lbl">${b.lbl}</span>
            </div>
          `;
        }).join("");

        chartHtml = `<div class="rep-bar-chart ${isYearly ? "yearly" : ""}" id="rep-bar-chart-container">${barsHtml}</div>`;
      } else {
        const W = 340;
        const H = 100;
        const pLeft = 8;
        const pRight = 8;
        const pTop = 16;
        const pBottom = 16;
        const cW = W - pLeft - pRight;
        const cH = H - pTop - pBottom;
        const N = ctx.bars.length;

        const points = ctx.bars.map((b, idx) => {
          const x = pLeft + (idx * cW) / Math.max(1, N - 1);
          const ratio = maxBarAmt > 0 ? (b.amt / maxBarAmt) : 0;
          const y = pTop + cH - (ratio * cH);
          return { x, y, b };
        });

        let pathD = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const mx = (p0.x + p1.x) / 2;
          const cpY0 = Math.min(pTop + cH, Math.max(pTop, p0.y));
          const cpY1 = Math.min(pTop + cH, Math.max(pTop, p1.y));
          pathD += ` C ${mx.toFixed(1)} ${cpY0.toFixed(1)}, ${mx.toFixed(1)} ${cpY1.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
        }
        const areaD = `${pathD} L ${points[points.length - 1].x.toFixed(1)} ${(pTop + cH).toFixed(1)} L ${points[0].x.toFixed(1)} ${(pTop + cH).toFixed(1)} Z`;

        // 浮動指示點與標籤
        let cursorDisplay = "display:none;";
        let cursorContent = "";
        const activeBarIdx = activeBarDayKey ? ctx.bars.findIndex(b => "bar_" + b.fullDate === activeBarDayKey) : -1;
        if (activeBarIdx >= 0) {
          const pt = points[activeBarIdx];
          cursorDisplay = "display:block;";
          const badgeX = Math.max(26, Math.min(W - 26, pt.x));
          const badgeY = Math.max(11, pt.y - 8);
          const valStr = pt.b.amt > 0 ? (pt.b.amt >= 10000 ? "$" + (pt.b.amt / 1000).toFixed(1) + "k" : "$" + pt.b.amt.toLocaleString()) : "$0";
          cursorContent = `
            <line x1="${pt.x.toFixed(1)}" y1="${pTop - 4}" x2="${pt.x.toFixed(1)}" y2="${(pTop + cH).toFixed(1)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2.5,2.5" />
            <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.5" />
            <g transform="translate(${badgeX.toFixed(1)}, ${badgeY.toFixed(1)})">
              <rect x="-22" y="-12" width="44" height="15" rx="4" fill="var(--accent)" />
              <text x="0" y="-1.5" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">${valStr}</text>
            </g>
          `;
        }

        // 靜態峰值與今日指示點
        let staticPointsHtml = "";
        points.forEach((pt) => {
          const isPeak = pt.b.amt === maxBarAmt && pt.b.amt > 0;
          if (isPeak) {
            staticPointsHtml += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3" fill="#f97316" />`;
          } else if (pt.b.isToday) {
            staticPointsHtml += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3" fill="var(--accent)" />`;
          }
        });

        // X 軸日期刻度（若今日離標準刻度差距小於等於 1 天，如 9 號離 10 號太近，則刪除綠色今日刻度避免遮蔽）
        const isCurM = (reportMonthOffset === 0);
        const tNum = (new Date()).getDate();
        const standardTicks = [1, 5, 10, 15, 20, 25, N];
        const tickSet = new Set(standardTicks);
        const isTooClose = standardTicks.some(k => k !== tNum && Math.abs(k - tNum) <= 1);
        if (isCurM && tNum >= 1 && tNum <= N && !isTooClose) {
          tickSet.add(tNum);
        }
        const sortedTicks = Array.from(tickSet).sort((a, b) => a - b);
        const xTicksHtml = sortedTicks.map(dNum => {
          const pct = (((dNum - 1) / Math.max(1, N - 1)) * 100).toFixed(1);
          const isT = isCurM && (dNum === tNum) && !isTooClose;
          const lbl = isT ? `${dNum}(今)` : (dNum === 1 || dNum === N ? dNum + "日" : String(dNum));
          return `<span class="${isT ? 'today-marker' : ''}" style="left:${pct}%;">${lbl}</span>`;
        }).join("");

        chartHtml = `
          <div class="rep-curve-card-wrapper">
            <div class="rep-y-axis">
              <span>$${formatYAxis(maxBarAmt)}</span>
              <span>$${formatYAxis(Math.round(maxBarAmt / 2))}</span>
              <span>$0</span>
            </div>
            <div class="rep-curve-chart-container" id="rep-curve-chart-container"
                 onpointerdown="onReportCurvePointerDown(event)"
                 onpointermove="onReportCurvePointerMove(event)"
                 onpointerup="onReportCurvePointerUp(event)"
                 onpointercancel="onReportCurvePointerUp(event)">
              <svg viewBox="0 0 ${W} ${H}" class="rep-curve-svg" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="repMonthlyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.38"/>
                    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>
                  </linearGradient>
                </defs>
                <line x1="${pLeft}" y1="${pTop}" x2="${W - pRight}" y2="${pTop}" stroke="var(--card-border)" stroke-dasharray="3,3" stroke-width="1" />
                <line x1="${pLeft}" y1="${pTop + cH / 2}" x2="${W - pRight}" y2="${pTop + cH / 2}" stroke="var(--card-border)" stroke-dasharray="3,3" stroke-width="1" />
                <line x1="${pLeft}" y1="${pTop + cH}" x2="${W - pRight}" y2="${pTop + cH}" stroke="var(--card-border)" stroke-width="1" />
                <path d="${areaD}" fill="url(#repMonthlyGrad)" />
                <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                ${staticPointsHtml}
                <g id="rep-curve-interactive-cursor" style="${cursorDisplay}">${cursorContent}</g>
              </svg>
              <div class="rep-curve-x-axis">${xTicksHtml}</div>
            </div>
          </div>
        `;
      }

      // 類別漲跌比較 HTML（移除類別表情符號，點擊類別可展開查看該類別的消費明細）
      const maxCatAmt = Math.max(...catDeltaList.map(c => Math.max(c.curr, c.prev)), 1);
      const catDeltaHtml = catDeltaList.length === 0
        ? `<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:8px;">尚無分類消費資料</div>`
        : catDeltaList.map(c => {
            const meta = CATEGORY_META[c.cat] || { icon: "📦", color: "#64748b" };
            let diffTag = `<span class="rep-diff-tag same">持平 $0</span>`;
            if (c.diff > 0) diffTag = `<span class="rep-diff-tag more">▲ +$${c.diff.toLocaleString()}</span>`;
            if (c.diff < 0) diffTag = `<span class="rep-diff-tag less">▼ -$${Math.abs(c.diff).toLocaleString()}</span>`;
            const currW = c.curr > 0 ? Math.max(4, Math.round((c.curr / maxCatAmt) * 100)) : 0;
            const prevW = c.prev > 0 ? Math.max(4, Math.round((c.prev / maxCatAmt) * 100)) : 0;
            const isExp = !!expandedReportCats["cat_" + c.cat];

            const drawerRowsHtml = c.records.length === 0
              ? `<div style="font-size:0.73rem;color:var(--text-muted);padding:2px 4px;">本期無此類別消費（${shortPrevName} $${c.prev.toLocaleString()}）</div>`
              : c.records.map(r => {
                  const fullD = String(r["Recorded At"] || "").slice(0, 10);
                  const shortD = fullD.slice(5);
                  const noteStr = escapeHtml(r.note || r.Category || "項目");
                  const amtNum = Math.round(Number(r.Amount) || 0);
                  return `
                    <div class="rep-cat-rec-mini-row">
                      <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                        <span style="color:var(--text-muted);font-size:0.7rem;flex-shrink:0;">${shortD}</span>
                        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${noteStr}</span>
                      </div>
                      <span style="font-weight:800;flex-shrink:0;">$${amtNum.toLocaleString()}</span>
                    </div>
                  `;
                }).join("");

            return `
              <div class="rep-cat-delta-item ${isExp ? "expanded" : ""}" onclick="toggleReportCatExpand('cat_${c.cat}')">
                <div class="rep-cat-delta-top">
                  <div class="rep-cat-left">
                    <span class="chip-dot" style="background:${meta.color};"></span>
                    <span>${c.cat}</span>
                    <span style="font-size:0.7rem;color:var(--text-muted);font-weight:600;">(${shortPrevName} $${c.prev.toLocaleString()})</span>
                  </div>
                  <div class="rep-cat-right">
                    <span>$${c.curr.toLocaleString()}</span>
                    ${diffTag}
                  </div>
                </div>
                <div class="rep-dual-bar-track">
                  <div class="rep-bar-curr" style="width:${currW}%; background:${meta.color};"></div>
                  <div class="rep-bar-prev" style="width:${prevW}%;"></div>
                </div>
                <div class="rep-cat-records-drawer">${drawerRowsHtml}</div>
              </div>
            `;
          }).join("");

      // 最常消費類別 & 單日最高峰（移除表情符號，點擊原地展開下拉式明細）
      const topFreqCat = catDeltaList.slice().sort((a, b) => b.count - a.count)[0];
      const freqTitle = (topFreqCat && topFreqCat.count > 0)
        ? topFreqCat.cat
        : "尚無紀錄";
      const freqDetail = (topFreqCat && topFreqCat.count > 0)
        ? `共 ${topFreqCat.count} 筆・$${topFreqCat.curr.toLocaleString()}`
        : "-";
      const isFreqExp = !!expandedReportCats["hl_freq"];
      const freqDrawerHtml = (topFreqCat && topFreqCat.records && topFreqCat.records.length > 0)
        ? topFreqCat.records.map(r => {
            const shortD = String(r["Recorded At"] || "").slice(5, 10);
            const noteStr = escapeHtml(r.note || r.Category || "項目");
            const amtNum = Math.round(Number(r.Amount) || 0);
            return `
              <div class="rep-cat-rec-mini-row">
                <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                  <span style="color:var(--text-muted);font-size:0.7rem;flex-shrink:0;">${shortD}</span>
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${noteStr}</span>
                </div>
                <span style="font-weight:800;flex-shrink:0;">$${amtNum.toLocaleString()}</span>
              </div>
            `;
          }).join("")
        : "";

      // 第二小卡：年報顯示「單月最高峰」，週報與月報顯示「單日最高峰」
      let secondBoxLbl = isYearly ? "單月最高峰" : "單日最高峰";
      let secondBoxTitle = "尚無花費";
      let secondBoxDetail = "$0";
      let peakDrawerHtml = "";
      const isPeakExp = !!expandedReportCats["hl_peak"];

      if (isYearly) {
        const peakMonthEntry = ctx.bars.slice().sort((a, b) => b.amt - a.amt)[0];
        if (peakMonthEntry && peakMonthEntry.amt > 0) {
          secondBoxTitle = `${peakMonthEntry.lbl} ($${peakMonthEntry.amt.toLocaleString()})`;
          secondBoxDetail = `全年度最高花費月份`;
          const peakMonthRecs = ctx.currRecs.filter(r => String(r["Recorded At"] || "").slice(0, 7) === peakMonthEntry.fullDate)
            .sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0));
          const renderPeakRecs = peakMonthRecs.slice(0, 50);
          peakDrawerHtml = renderPeakRecs.map(r => {
            const shortD = String(r["Recorded At"] || "").slice(5, 10);
            const noteStr = escapeHtml(r.note || r.Category || "項目");
            const amtNum = Math.round(Number(r.Amount) || 0);
            return `
              <div class="rep-cat-rec-mini-row">
                <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                  <span style="color:var(--text-muted);font-size:0.7rem;flex-shrink:0;">${shortD}</span>
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${noteStr}</span>
                </div>
                <span style="font-weight:800;flex-shrink:0;">$${amtNum.toLocaleString()}</span>
              </div>
            `;
          }).join("");
          if (peakMonthRecs.length > 50) {
            peakDrawerHtml += `<div style="font-size:0.68rem;color:var(--text-muted);text-align:center;padding:4px 0;">僅顯示單筆前 50 筆（共 ${peakMonthRecs.length} 筆）</div>`;
          }
        }
      } else {
        const peakDayEntry = Object.keys(daySumMap)
          .map(d => ({ fullDate: d, amt: Math.round(daySumMap[d]) }))
          .sort((a, b) => b.amt - a.amt)[0];

        if (peakDayEntry && peakDayEntry.amt > 0) {
          const parts = peakDayEntry.fullDate.split("/").map(Number);
          const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
          const wNames = ["日", "一", "二", "三", "四", "五", "六"];
          const wLbl = wNames[dObj.getDay()];
          secondBoxTitle = `${peakDayEntry.fullDate.slice(5)} (週${wLbl})`;
          secondBoxDetail = `單日 $${peakDayEntry.amt.toLocaleString()}`;
          const peakRecs = (dayRecordsMap[peakDayEntry.fullDate] || []).slice().sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0));
          peakDrawerHtml = peakRecs.map(r => {
            const timePart = String(r["Recorded At"] || "").slice(11, 16) || r.Category || "";
            const noteStr = escapeHtml(r.note || r.Category || "項目");
            const amtNum = Math.round(Number(r.Amount) || 0);
            return `
              <div class="rep-cat-rec-mini-row">
                <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                  <span style="color:var(--text-muted);font-size:0.7rem;flex-shrink:0;">${escapeHtml(timePart)}</span>
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${noteStr}</span>
                </div>
                <span style="font-weight:800;flex-shrink:0;">$${amtNum.toLocaleString()}</span>
              </div>
            `;
          }).join("");
        }
      }

      // Top 3 單筆最高消費（去掉類別表情符號，點擊原地展開下拉明細）
      const top3Recs = ctx.currRecs.slice().sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0)).slice(0, 3);
      const topItemsHtml = top3Recs.length === 0
        ? `<div style="text-align:center;color:var(--text-muted);font-size:0.78rem;padding:6px;">尚無單筆消費排行</div>`
        : top3Recs.map((r, idx) => {
            const fullD = String(r["Recorded At"] || "").slice(0, 10);
            const dShort = fullD.slice(5, 10);
            const noteText = escapeHtml(r.note || r.Category || "未命名項目");
            const topKey = "hl_top_" + idx;
            const isTopExp = !!expandedReportCats[topKey];
            const sameDayRecs = (dayRecordsMap[fullD] || [r]).slice().sort((a, b) => (Number(b.Amount) || 0) - (Number(a.Amount) || 0));
            const topDrawerHtml = sameDayRecs.map(dr => {
              const tStr = String(dr["Recorded At"] || "").slice(5, 16);
              const catStr = escapeHtml(dr.Category || "其他");
              const nStr = escapeHtml(dr.note || dr.Category || "項目");
              const aNum = Math.round(Number(dr.Amount) || 0);
              return `
                <div class="rep-cat-rec-mini-row">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                    <span style="color:var(--text-muted);font-size:0.68rem;flex-shrink:0;">${tStr} · ${catStr}</span>
                    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${nStr}</span>
                  </div>
                  <span style="font-weight:800;flex-shrink:0;">$${aNum.toLocaleString()}</span>
                </div>
              `;
            }).join("");

            return `
              <div class="rep-cat-delta-item ${isTopExp ? "expanded" : ""}" style="background:var(--bg);border:1px solid var(--card-border);" onclick="toggleReportCatExpand('${topKey}')">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.8rem;font-weight:700;">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1;">
                    <span class="rep-rank-badge">#${idx + 1}</span>
                    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${noteText}</span>
                    <span style="font-size:0.7rem;color:var(--text-muted);flex-shrink:0;">${dShort}</span>
                  </div>
                  <span style="font-weight:900;flex-shrink:0;">$${Math.round(Number(r.Amount) || 0).toLocaleString()}</span>
                </div>
                <div class="rep-cat-records-drawer">${topDrawerHtml}</div>
              </div>
            `;
          }).join("");

      body.innerHTML = `
        <div class="report-period-nav">
          <button type="button" class="nav-arrow-sm" onclick="stepReportPeriod(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span>${ctx.periodTitle}</span>
          <button type="button" class="nav-arrow-sm" onclick="stepReportPeriod(1)" ${ctx.canNext ? "" : "disabled style='opacity:0.3;pointer-events:none;'"}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <div class="rep-hero-card">
          <div class="rep-hero-top">
            <div>
              <div class="rep-hero-label">${heroTitleText}</div>
              <div class="rep-hero-amt">$${ctx.currTotal.toLocaleString()}</div>
            </div>
            <div class="rep-delta-stack">
              <span class="rep-delta-pill ${deltaClass}">${deltaLabel}</span>
            </div>
          </div>
          <div class="rep-hero-metrics-grid">
            <div class="rep-metric-tile">
              <span class="rep-metric-tile-lbl">${prevName}</span>
              <span class="rep-metric-tile-val">$${ctx.prevTotal.toLocaleString()}</span>
              <span class="rep-metric-tile-sub">${ctx.isPartial ? "同期對比" : "完整期間"}</span>
            </div>
            <div class="rep-metric-tile">
              <span class="rep-metric-tile-lbl">${isYearly ? "月均支出" : "日均支出"}</span>
              <span class="rep-metric-tile-val">$${(isYearly ? ctx.monthlyAvg : ctx.dailyAvg).toLocaleString()}</span>
              <span class="rep-metric-tile-sub">${tile2SubText}</span>
            </div>
            <div class="rep-metric-tile">
              <span class="rep-metric-tile-lbl">最大增減</span>
              ${swingUpHtml}
              ${swingDownHtml}
            </div>
          </div>
        </div>

        <div class="rep-section-card">
          <div class="rep-sec-title">
            <span>${isWeekly ? "週一 ～ 週日 花費分佈" : (isYearly ? "當年度各月花費分佈" : "當月每日花費分佈")}</span>
          </div>
          ${chartHtml}
          <div id="rep-chart-active-drawer" class="rep-cat-records-drawer" style="${activeBarDrawerContent ? 'display:flex;' : 'display:none;'}margin-top:8px;">
            ${activeBarDrawerContent}
          </div>
        </div>

        <div class="rep-section-card">
          <div class="rep-sec-title">
            <span>類別花費漲跌對比</span>
          </div>
          <div class="rep-cat-delta-list">${catDeltaHtml}</div>
        </div>

        <div class="rep-section-card">
          <div class="rep-sec-title">
            <span>哪裡花最多</span>
          </div>
          <div class="rep-highlights-grid">
            <div class="rep-mini-stat-box rep-clickable-card" onclick="toggleReportCatExpand('hl_freq')">
              <span class="rep-mini-stat-lbl">最常消費類別</span>
              <span class="rep-mini-stat-val">${freqTitle}</span>
              <span style="font-size:0.72rem;color:var(--text-muted);">${freqDetail}</span>
            </div>
            <div class="rep-mini-stat-box rep-clickable-card" onclick="toggleReportCatExpand('hl_peak')">
              <span class="rep-mini-stat-lbl">${secondBoxLbl}</span>
              <span class="rep-mini-stat-val">${secondBoxTitle}</span>
              <span style="font-size:0.72rem;color:var(--text-muted);">${secondBoxDetail}</span>
            </div>
          </div>
          ${isFreqExp && freqDrawerHtml ? `<div class="rep-cat-records-drawer" style="display:flex;margin-top:2px;">${freqDrawerHtml}</div>` : ""}
          ${isPeakExp && peakDrawerHtml ? `<div class="rep-cat-records-drawer" style="display:flex;margin-top:2px;">${peakDrawerHtml}</div>` : ""}
          <div class="rep-top-list">${topItemsHtml}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
